<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071018">
<meta name="description" content="Koraput Live Map — realtime location, friends, chat and memories">
<title>Koraput Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:#071018;color:#f5f7f8;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}
#map{position:fixed;inset:0;z-index:1}.leaflet-control-attribution{font-size:9px!important;opacity:.65}
#top-header{position:fixed;top:14px;left:14px;right:14px;z-index:1000;display:flex;justify-content:space-between;pointer-events:none}.brand-card{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(7,16,24,.9);backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.55)}.brand-dot{width:9px;height:9px;border-radius:50%;background:#18d6a3;box-shadow:0 0 14px #18d6a3}.header-info{display:flex;flex-direction:column;line-height:1.1}.header-info strong{font-size:13px}.header-info span{margin-top:3px;color:#8d9ba2;font-size:9px}.header-info span:last-child:before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:#18d6a3}.header-online{color:#18d6a3!important}.header-avatar{display:none;width:34px;height:34px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
#map-tools{position:fixed;right:14px;top:88px;z-index:1000;display:flex;flex-direction:column;gap:8px}.map-tool-button{width:42px;height:42px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(7,16,24,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.55)}#compass-icon{font-size:14px;font-weight:800;transition:transform 0.3s}
#map-style-menu{position:fixed;right:62px;top:188px;z-index:1100;display:none;flex-direction:column;gap:4px;min-width:145px;padding:7px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(7,16,24,.97);box-shadow:0 12px 40px rgba(0,0,0,.55)}#map-style-menu button{border:0;border-radius:9px;padding:9px 11px;background:transparent;color:#dbe4e8;text-align:left;font-size:12px}#map-style-menu button.active,#map-style-menu button:hover{background:rgba(16,185,129,.16);color:#18d6a3}
#bottom-info{position:fixed;left:50%;bottom:17px;transform:translateX(-50%);z-index:1000;display:flex;gap:7px;pointer-events:none}.bottom-pill{padding:8px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(7,16,24,.9);color:#e9eef0;font-size:10px;white-space:nowrap;backdrop-filter:blur(14px)}.bottom-pill.live{color:#18d6a3}
#memoryButton,#chat-toggle-btn{position:fixed;bottom:17px;z-index:1200;width:48px;height:48px;border:1px solid rgba(255,255,255,.12);background:rgba(7,16,24,.94);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.55)}#memoryButton{left:16px;border-radius:14px;font-size:21px}#chat-toggle-btn{right:16px;border-radius:50%;font-size:20px}#chat-unread-badge{position:absolute;right:-2px;top:-2px;display:none;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:9px;align-items:center;justify-content:center}
#join-screen{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(16,185,129,.12),transparent 40%),#071018}.join-card{width:min(390px,100%);padding:26px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(9,20,29,.96);box-shadow:0 25px 80px rgba(0,0,0,.6);text-align:center}.join-logo{width:58px;height:58px;margin:0 auto 15px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(16,185,129,.12);font-size:27px}.join-card h1{margin:0;font-size:21px}.join-card p{margin:7px 0 21px;color:#8d9ba2;font-size:11px;line-height:1.5}.join-card input{width:100%;height:44px;padding:0 13px;border:1px solid rgba(255,255,255,.09);border-radius:12px;outline:0;background:rgba(255,255,255,.05);color:#fff}.avatar-upload{display:block;margin-top:10px;padding:12px;border:1px dashed rgba(255,255,255,.15);border-radius:12px;color:#b8c4c9;font-size:11px;cursor:pointer}.join-card #avatarInput{display:none}.join-card #join-submit{margin-top:13px;border:0;background:#10b981;color:#fff;font-weight:750;width:100%;height:44px;border-radius:12px;}
#chat-container{position:fixed;right:18px;bottom:18px;z-index:2000;width:min(390px,calc(100vw - 28px));height:min(600px,calc(100vh - 36px));display:none;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(7,16,24,.98);box-shadow:0 20px 70px rgba(0,0,0,.65);backdrop-filter:blur(18px)}#chat-header{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)}.chat-title{display:flex;align-items:center;gap:9px}.chat-title-dot{width:8px;height:8px;border-radius:50%;background:#18d6a3}.chat-title-text{display:flex;flex-direction:column}.chat-title-text strong{font-size:13px}.chat-title-text span{font-size:9px;color:#8d9ba2;margin-top:2px}.chat-head-actions{display:flex;align-items:center;gap:6px}.chat-head-btn{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center}.online-wrap{position:relative}.online-list{position:absolute;right:0;top:42px;width:210px;max-height:300px;overflow:auto;display:none;padding:6px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(7,16,24,.98);box-shadow:0 15px 50px rgba(0,0,0,.6)}.online-user{width:100%;display:flex;gap:8px;align-items:center;border:0;background:transparent;color:#fff;padding:8px;border-radius:8px;text-align:left}.online-user:hover{background:rgba(255,255,255,.06)}.online-user img{width:30px;height:30px;border-radius:50%;object-fit:cover}.online-user span{display:flex;flex-direction:column}.online-user small{color:#8d9ba2;font-size:9px}.online-empty{padding:10px;color:#8d9ba2;font-size:10px}
#chat-messages{flex:1;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:10px}.chat-row{display:flex;max-width:84%}.chat-row:has(.msg-mine){align-self:flex-end}.chat-message{position:relative;padding:8px 10px;border-radius:13px;font-size:12px;line-height:1.4;overflow-wrap:anywhere}.msg-mine{background:rgba(16,185,129,.18);border:1px solid rgba(16,185,129,.18);border-bottom-right-radius:4px}.msg-theirs{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.07);border-bottom-left-radius:4px}.msg-sender{margin-bottom:3px;color:#18d6a3;font-size:9px;font-weight:750}.chat-media{display:block;max-width:100%;max-height:260px;border-radius:8px}.chat-audio{width:100%;height:36px}.chat-document{color:#18d6a3;text-decoration:none;font-weight:650}.reply-quote{margin-bottom:6px;padding:5px 7px;border-left:2px solid #18d6a3;border-radius:5px;background:rgba(255,255,255,.06);color:#9eafb5;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message-actions{display:none;position:absolute;right:5px;bottom:-29px;z-index:5;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:#071018}.chat-message:hover .message-actions,.chat-message:focus-within .message-actions{display:flex}.reaction-chip,.message-action-reply,.reaction-count{border:0;border-radius:6px;padding:4px 5px;background:transparent;color:#fff;font-size:11px}.reaction-chip:hover,.message-action-reply:hover{background:rgba(255,255,255,.08)}.message-reactions{display:flex;gap:3px;position:absolute;left:8px;bottom:-10px}.reaction-count{border:1px solid rgba(255,255,255,.12);background:#111c24;font-size:9px;border-radius:999px}.typing-indicator{display:none;padding:0 13px 5px;color:#8d9ba2;font-size:9px}.reply-bar{display:none;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;padding:7px 9px;border-left:2px solid #18d6a3;border-radius:7px;background:rgba(255,255,255,.05);font-size:9px}.reply-bar button{border:0;background:transparent;color:#fff}.chat-form-area{position:relative;padding:9px;border-top:1px solid rgba(255,255,255,.08)}#attachment-menu,#emoji-picker-container{position:absolute;z-index:30;display:none;background:rgba(7,16,24,.98);border:1px solid rgba(255,255,255,.1);border-radius:13px;box-shadow:0 15px 50px rgba(0,0,0,.6)}#attachment-menu{left:9px;bottom:62px;width:155px;padding:6px}#attachment-menu button{display:block;width:100%;border:0;border-radius:8px;padding:9px;background:transparent;color:#dce5e8;text-align:left;font-size:11px}#attachment-menu button:hover{background:rgba(255,255,255,.07)}#emoji-picker-container{right:8px;bottom:62px;width:min(320px,calc(100vw - 40px))}.chat-form{display:flex;align-items:center;gap:6px}.chat-icon-btn{flex:0 0 36px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:#8d9ba2;display:flex;align-items:center;justify-content:center}.chat-icon-btn:hover{background:rgba(255,255,255,.06);color:#fff}#chatInput{min-width:0;flex:1;height:38px;padding:0 11px;border:1px solid rgba(255,255,255,.08);border-radius:12px;outline:0;background:rgba(255,255,255,.055);color:#fff;font-size:12px}#chat-send{display:none;flex:0 0 36px;width:36px;height:36px;border:0;border-radius:50%;background:#10b981;color:#fff}
#profile-popup{position:fixed;inset:0;z-index:5500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.45);backdrop-filter:blur(5px)}.profile-card{width:min(310px,92vw);padding:22px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(7,16,24,.98);box-shadow:0 25px 80px rgba(0,0,0,.65);text-align:center}.profile-card img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid #60a5fa}.profile-card h3{margin:10px 0 3px}.profile-card p{margin:5px 0;color:#8d9ba2;font-size:10px}.profile-card .online{color:#18d6a3}.profile-actions{display:flex;gap:7px;margin-top:14px}.profile-actions button{flex:1;border:0;border-radius:10px;padding:10px;background:rgba(255,255,255,.07);color:#fff}.profile-actions .primary{background:#10b981}
.avatar-icon{border-radius:50%}.own-live-avatar{border:2.5px solid #18d6a3!important;animation:radar 2s infinite}.friend-marker{border:2px solid #60a5fa!important}.weather-badge{padding:4px 7px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:999px!important;background:rgba(7,16,24,.92)!important;color:#e8eef0!important;font-size:9px!important}.custom-pin{background:transparent!important;border:0!important}@keyframes radar{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7),0 3px 10px rgba(0,0,0,.65)}70%{box-shadow:0 0 0 16px rgba(16,185,129,0),0 3px 10px rgba(0,0,0,.65)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0),0 3px 10px rgba(0,0,0,.65)}}
button:focus-visible,input:focus-visible{outline:2px solid #18d6a3;outline-offset:2px}
@media(max-width:600px){#top-header{top:10px;left:10px;right:10px}.brand-card{padding:8px 10px}.header-info strong{font-size:12px}#map-tools{right:10px;top:76px;gap:6px}.map-tool-button{width:40px;height:40px}#map-style-menu{right:58px;top:166px}#bottom-info{bottom:12px;max-width:calc(100vw - 120px);overflow:hidden}.bottom-pill{padding:7px 9px;font-size:9px}#memoryButton{left:10px;bottom:11px;width:44px;height:44px}#chat-toggle-btn{right:10px;bottom:11px;width:44px;height:44px}#chat-container{right:0;bottom:0;width:100vw;height:100dvh;border-radius:0}.online-list{position:fixed;right:10px;top:70px;width:230px}.chat-row{max-width:90%}}
</style>
</head>
<body>
<div id="map"></div>
<div id="top-header">
    <div class="brand-card">
        <div class="brand-dot"></div>
        <div class="header-info">
            <strong id="header-app-title">Koraput Map</strong>
            <span>Real-time Location</span>
            <span id="header-online-status" class="header-online">1 online</span>
        </div>
        <img id="header-avatar" class="header-avatar" src="satyam.png" alt="Profile">
    </div>
</div>

<div id="map-tools">
    <button id="my-location-btn" class="map-tool-button" title="My location">⦿</button>
    <button id="compass-btn" class="map-tool-button" title="Compass"><span id="compass-icon">N</span></button>
    <button id="map-style-btn" class="map-tool-button" title="Map style">◈</button>
</div>

<div id="map-style-menu">
    <button data-style="satellite" class="active">🛰️ Satellite</button>
    <button data-style="street">🗺️ Street</button>
    <button data-style="dark">🌑 Dark</button>
</div>

<div id="bottom-info">
    <div class="bottom-pill" id="pill-city">📍 Locating…</div>
    <div class="bottom-pill">🌡️ <span id="map-temp-display">--°C</span></div>
    <div class="bottom-pill live">● Live Location</div>
</div>

<button id="memoryButton" type="button" title="Add memory">📸</button>
<input id="memoryPhotoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<button id="chat-toggle-btn" type="button" title="Open chat">💬<span id="chat-unread-badge">0</span></button>

<div id="chat-container">
    <div id="chat-header">
        <div class="chat-title">
            <div class="chat-title-dot"></div>
            <div class="chat-title-text">
                <strong>Koraput Chat</strong>
                <span id="chat-subtitle">Live group chat</span>
            </div>
        </div>
        <div class="chat-head-actions">
            <div class="online-wrap">
                <button id="online-btn" class="chat-head-btn" type="button" title="Online users">👥</button>
                <div id="online-list" class="online-list"></div>
            </div>
            <button id="chat-minimize-btn" class="chat-head-btn" type="button">×</button>
        </div>
    </div>
    
    <div id="chat-messages"></div>
    <div id="typing-indicator" class="typing-indicator"></div>
    
    <div class="chat-form-area">
        <div id="reply-bar" class="reply-bar">
            <span id="reply-preview"></span>
            <button id="reply-cancel" type="button">×</button>
        </div>
        
        <div id="attachment-menu">
            <button id="att-media" type="button">🖼️ Photo / Video</button>
            <button id="att-doc" type="button">📄 Document</button>
            <button id="att-audio" type="button">🎵 Audio</button>
        </div>
        
        <div id="emoji-picker-container"><emoji-picker id="emojiPicker"></emoji-picker></div>
        
        <form id="chatForm" class="chat-form">
            <button id="chat-attach-btn" class="chat-icon-btn" type="button">＋</button>
            <button id="emojiButton" class="chat-icon-btn" type="button">☺</button>
            <input id="chatInput" type="text" maxlength="1000" autocomplete="off" placeholder="Type a message…">
            <button id="voiceButton" class="chat-icon-btn" type="button">🎙️</button>
            <button id="chat-send" type="submit">➤</button>
        </form>
        <input id="chatAttachment" type="file" hidden>
    </div>
</div>

<div id="profile-popup">
    <div class="profile-card">
        <button id="profile-close" style="position:absolute;right:12px;top:12px;width:32px;height:32px;border:0;border-radius:9px;background:rgba(255,255,255,.07);color:#fff">×</button>
        <img id="profile-avatar" src="satyam.png" alt="Profile">
        <h3 id="profile-name">Friend</h3>
        <p id="profile-status" class="online">Online</p>
        <p id="profile-distance">Location unavailable</p>
        <p id="profile-weather">Weather unavailable</p>
        <div class="profile-actions"><button id="profile-focus" class="primary" type="button">📍 Focus on map</button></div>
    </div>
</div>

<div id="join-screen">
    <div class="join-card">
        <div class="join-logo">📍</div>
        <h1>Welcome to Koraput Map</h1>
        <p>Join the live map, realtime friends, memories and chat.</p>
        <form id="join-form">
            <input id="nameInput" maxlength="40" autocomplete="name" placeholder="Your name" required>
            <label class="avatar-upload" for="avatarInput">
                <span id="avatar-label-text">Choose profile photo</span>
            </label>
            <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
            <button id="join-submit" type="submit">Enter Map</button>
        </form>
    </div>
</div>

<!-- Scripts (Phase 3 is now seamlessly integrated into app.js) -->
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
