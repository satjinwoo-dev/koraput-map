<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#071018">
    <meta name="description" content="Live Real-time Location, memories and chat">
    <title>Live Location Map</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Emoji Picker -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #071018;
            --panel: rgba(7, 16, 24, 0.96);
            --panel-soft: rgba(10, 22, 31, 0.92);
            --border: rgba(255, 255, 255, 0.10);

            --green: #10b981;
            --green-bright: #18d6a3;

            --blue: #60a5fa;
            --text: #f5f7f8;
            --muted: #8d9ba2;

            --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }

        /* =========================================
           MAP
        ========================================= */
        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #071018;
            z-index: 1;
        }

        .leaflet-control-attribution {
            font-size: 9px !important;
            opacity: 0.65;
        }

        /* =========================================
           TOP HEADER
        ========================================= */
        #top-header {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .brand-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 13px;
            background: rgba(7, 16, 24, 0.88);
            border: 1px solid var(--border);
            border-radius: 15px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            pointer-events: auto;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            flex: 0 0 9px;
            border-radius: 50%;
            background: var(--green-bright);
            box-shadow: 0 0 8px rgba(24, 214, 163, 0.9), 0 0 16px rgba(24, 214, 163, 0.35);
        }

        .header-info {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .header-info strong {
            font-size: 13px;
            font-weight: 750;
            letter-spacing: 0.2px;
        }

        .header-info span {
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
        }

        .header-info span:last-child::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 5px;
            border-radius: 50%;
            background: var(--green-bright);
            box-shadow: 0 0 8px rgba(24, 214, 163, 0.8);
        }

        #header-avatar {
            width: 34px;
            height: 34px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.18);
            background: #101b23;
            display: none;
        }

        /* =========================================
           MAP CONTROLS
        ========================================= */
        #map-tools {
            position: fixed;
            right: 14px;
            top: 88px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .map-tool-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: rgba(7, 16, 24, 0.91);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .map-tool-button:hover {
            background: rgba(16, 185, 129, 0.18);
        }

        .map-tool-button:active {
            transform: scale(0.92);
        }

        #compass-icon {
            display: block;
            font-size: 14px;
            font-weight: 800;
            transform-origin: center;
        }

        /* =========================================
           MAP STYLE MENU
        ========================================= */
        #map-style-menu {
            position: fixed;
            right: 62px;
            top: 188px;
            z-index: 1100;
            display: none;
            flex-direction: column;
            gap: 5px;
            min-width: 145px;
            padding: 7px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(7, 16, 24, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
        }

        #map-style-menu button {
            border: 0;
            border-radius: 9px;
            padding: 9px 11px;
            background: transparent;
            color: #dbe4e8;
            text-align: left;
            font-size: 12px;
        }

        #map-style-menu button:hover,
        #map-style-menu button.active {
            background: rgba(16, 185, 129, 0.16);
            color: var(--green-bright);
        }

        /* =========================================
           BOTTOM INFO
        ========================================= */
        #bottom-info {
            position: fixed;
            left: 50%;
            bottom: 17px;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 7px;
            pointer-events: none;
        }

        .bottom-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(7, 16, 24, 0.9);
            border: 1px solid var(--border);
            color: #e9eef0;
            font-size: 11px;
            white-space: nowrap;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .bottom-pill.live {
            color: var(--green-bright);
        }

        /* =========================================
           MEMORY BUTTON
        ========================================= */
        #memoryButton {
            position: fixed;
            left: 16px;
            bottom: 17px;
            z-index: 1200;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(7, 16, 24, 0.94);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        #memoryButton:hover {
            background: rgba(16, 185, 129, 0.18);
        }

        #memoryButton:active {
            transform: scale(0.92);
        }

        #memoryPhotoInput {
            display: none;
        }

        /* =========================================
           CHAT TOGGLE
        ========================================= */
        #chat-toggle-btn {
            position: fixed;
            right: 16px;
            bottom: 17px;
            z-index: 1200;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            background: rgba(7, 16, 24, 0.94);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        #chat-toggle-btn:active {
            transform: scale(0.92);
        }

        /* =========================================
           CHAT
        ========================================= */
        #chat-container {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 2000;
            width: min(390px, calc(100vw - 28px));
            height: min(600px, calc(100vh - 36px));
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            background: rgba(7, 16, 24, 0.97);
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        #chat-header {
            height: 58px;
            flex: 0 0 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .chat-title-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green-bright);
            box-shadow: 0 0 10px rgba(24, 214, 163, 0.75);
        }

        .chat-title-text {
            display: flex;
            flex-direction: column;
        }

        .chat-title-text strong {
            font-size: 13px;
        }

        .chat-title-text span {
            margin-top: 2px;
            color: var(--muted);
            font-size: 9px;
        }

        #chat-minimize-btn {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #c8d1d5;
            font-size: 18px;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 13px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.14) transparent;
        }

        .chat-message {
            max-width: 82%;
            padding: 8px 10px;
            border-radius: 13px;
            font-size: 12px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .msg-mine {
            align-self: flex-end;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.18);
            border-bottom-right-radius: 4px;
        }

        .msg-theirs {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.065);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-bottom-left-radius: 4px;
        }

        .msg-sender {
            margin-bottom: 3px;
            color: var(--green-bright);
            font-size: 9px;
            font-weight: 750;
        }

        .chat-media {
            display: block;
            max-width: 100%;
            max-height: 260px;
            border-radius: 8px;
        }

        .chat-audio {
            width: 100%;
            height: 36px;
        }

        .chat-document {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--green-bright);
            text-decoration: none;
            font-weight: 650;
        }

        #chat-form-area {
            position: relative;
            padding: 9px;
            border-top: 1px solid var(--border);
        }

        #attachment-menu {
            position: absolute;
            left: 9px;
            bottom: 62px;
            z-index: 20;
            display: none;
            flex-direction: column;
            gap: 3px;
            width: 155px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: rgba(7, 16, 24, 0.98);
            box-shadow: var(--shadow);
        }

        #attachment-menu button {
            border: 0;
            border-radius: 8px;
            padding: 9px;
            background: transparent;
            color: #dce5e8;
            text-align: left;
            font-size: 11px;
        }

        #attachment-menu button:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        #emoji-picker-container {
            position: absolute;
            right: 8px;
            bottom: 62px;
            z-index: 30;
            display: none;
            width: min(320px, calc(100vw - 40px));
            box-shadow: var(--shadow);
        }

        #emojiPicker {
            width: 100%;
            max-width: 100%;
        }

        #chatForm {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-icon-btn {
            flex: 0 0 36px;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-icon-btn:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        #chatInput {
            min-width: 0;
            flex: 1;
            height: 38px;
            padding: 0 11px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.055);
            color: white;
            font-size: 12px;
        }

        #chatInput::placeholder {
            color: #708087;
        }

        #chatInput:focus {
            border-color: rgba(16, 185, 129, 0.45);
        }

        #chat-send {
            display: none;
            flex: 0 0 36px;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 50%;
            background: var(--green);
            color: white;
            align-items: center;
            justify-content: center;
        }

        #voiceButton {
            display: flex;
        }

        /* =========================================
           JOIN SCREEN
        ========================================= */
        #join-screen {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.12), transparent 40%), #071018;
        }

        .join-card {
            width: min(390px, 100%);
            padding: 26px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 22px;
            background: rgba(9, 20, 29, 0.94);
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            text-align: center;
        }

        .join-logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.20);
            font-size: 27px;
        }

        .join-card h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 800;
        }

        .join-card p {
            margin: 7px 0 21px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        #nameInput {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 13px;
        }

        #nameInput:focus {
            border-color: rgba(16,185,129,0.45);
        }

        .avatar-upload {
            margin-top: 10px;
            display: block;
            padding: 12px;
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #b8c4c9;
            font-size: 11px;
            cursor: pointer;
        }

        .avatar-upload:hover {
            border-color: rgba(16,185,129,0.45);
            color: var(--green-bright);
        }

        #avatarInput { display: none; }

        #join-submit {
            width: 100%;
            height: 44px;
            margin-top: 13px;
            border: 0;
            border-radius: 12px;
            background: var(--green);
            color: white;
            font-size: 13px;
            font-weight: 750;
        }

        #join-submit:active {
            transform: scale(0.98);
        }

        /* =========================================
           LIVE LOCATION AVATARS (WITH RADAR RING)
           FIX: Removed 'margin: 0 !important' to allow Leaflet to center icons.
        ========================================= */
        @keyframes avatarRadarPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7), 0 3px 10px rgba(0,0,0,0.65);
            }
            70% {
                box-shadow: 0 0 0 16px rgba(16, 185, 129, 0), 0 3px 10px rgba(0,0,0,0.65);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0), 0 3px 10px rgba(0,0,0,0.65);
            }
        }

        .leaflet-marker-icon.avatar-icon.own-live-avatar {
            width: 36px !important;
            height: 36px !important;
            padding: 1px !important;
            box-sizing: border-box !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            border: 2.5px solid var(--green-bright) !important;
            background: #071018 !important;
            overflow: hidden !important;
            display: block !important;
            animation: avatarRadarPulse 2s infinite !important;
        }

        .leaflet-marker-icon.avatar-icon.friend-marker {
            width: 34px !important;
            height: 34px !important;
            padding: 1px !important;
            box-sizing: border-box !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            border: 2px solid var(--blue) !important;
            background: #071018 !important;
            overflow: hidden !important;
            display: block !important;
            box-shadow: 0 0 0 2px rgba(96,165,250,0.15), 0 3px 10px rgba(0,0,0,0.6) !important;
        }

        /* =========================================
           MEMORY PINS
        ========================================= */
        .custom-pin {
            background: transparent !important;
            border: 0 !important;
        }

        .memory-pin-box {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: #071018;
            border: 2px solid white;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }

        .memory-pin-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================================
           WEATHER BADGE
        ========================================= */
        .weather-badge {
            padding: 4px 7px !important;
            border: 1px solid rgba(255,255,255,0.09) !important;
            border-radius: 999px !important;
            background: rgba(7,16,24,0.92) !important;
            color: #e8eef0 !important;
            font-size: 9px !important;
            font-weight: 650 !important;
            box-shadow: 0 4px 14px rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .weather-badge::before {
            border-right-color: rgba(7,16,24,0.92) !important;
        }

        /* =========================================
           MOBILE
        ========================================= */
        @media (max-width: 600px) {
            #top-header { top: 10px; left: 10px; right: 10px; }
            .brand-card { padding: 8px 10px; border-radius: 13px; }
            .header-info strong { font-size: 12px; }
            .header-info span { font-size: 9px; }
            #header-avatar { width: 31px; height: 31px; }

            #map-tools { right: 10px; top: 76px; gap: 6px; }
            .map-tool-button { width: 40px; height: 40px; border-radius: 12px; }
            #map-style-menu { right: 58px; top: 166px; }

            #bottom-info { bottom: 12px; max-width: calc(100vw - 125px); overflow: hidden; }
            .bottom-pill { padding: 7px 9px; font-size: 10px; }

            #memoryButton { left: 10px; bottom: 11px; width: 44px; height: 44px; }
            #chat-toggle-btn { right: 10px; bottom: 11px; width: 44px; height: 44px; }

            #chat-container { right: 0; bottom: 0; width: 100vw; height: 100dvh; border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; }

            /* FIX APPLIED: Removed margin: 0 !important */
            .leaflet-marker-icon.own-live-avatar { width: 36px !important; height: 36px !important; }
            .leaflet-marker-icon.friend-marker { width: 34px !important; height: 34px !important; }
        }

        @media (max-width: 380px) {
            .leaflet-marker-icon.own-live-avatar { width: 34px !important; height: 34px !important; }
            .leaflet-marker-icon.friend-marker { width: 32px !important; height: 32px !important; }
            #bottom-info { max-width: calc(100vw - 110px); }
            .bottom-pill { padding: 6px 8px; font-size: 9px; }
        }

        /* =========================================
           ACCESSIBILITY / TOUCH
        ========================================= */
        button:focus-visible, input:focus-visible, label:focus-visible {
            outline: 2px solid var(--green-bright);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- MAP -->
    <div id="map"></div>

    <!-- HEADER -->
    <div id="top-header">
        <div class="brand-card">
            <div class="brand-dot"></div>
            <div class="header-info">
                <strong id="header-app-title">Live Map</strong>
                <span>Real-time Location</span>
            </div>
            <img id="header-avatar" src="satyam.png" alt="Profile">
        </div>
    </div>

    <!-- MAP TOOLS -->
    <div id="map-tools">
        <button id="my-location-btn" class="map-tool-button" type="button" title="My location" aria-label="My location">⦿</button>
        <button id="compass-btn" class="map-tool-button" type="button" title="North" aria-label="Compass"><span id="compass-icon">N</span></button>
        <button id="map-style-btn" class="map-tool-button" type="button" title="Map style" aria-label="Map style">◈</button>
    </div>

    <!-- MAP STYLE MENU -->
    <div id="map-style-menu">
        <button type="button" data-style="satellite" class="active">🛰️ Satellite</button>
        <button type="button" data-style="street">🗺️ Street</button>
        <button type="button" data-style="dark">🌑 Dark</button>
    </div>

    <!-- BOTTOM INFO -->
    <div id="bottom-info">
        <div class="bottom-pill" id="pill-city">📍 Locating...</div>
        <div class="bottom-pill">🌡️ <span id="map-temp-display">--°C</span></div>
        <div class="bottom-pill live">● Live Location</div>
    </div>

    <!-- MEMORY BUTTON -->
    <button id="memoryButton" type="button" title="Add memory" aria-label="Add memory">📸</button>
    <input id="memoryPhotoInput" type="file" accept="image/*">

    <!-- CHAT TOGGLE -->
    <button id="chat-toggle-btn" type="button" title="Open chat" aria-label="Open chat">💬</button>

    <!-- CHAT -->
    <div id="chat-container">
        <div id="chat-header">
            <div class="chat-title">
                <div class="chat-title-dot"></div>
                <div class="chat-title-text">
                    <strong>Koraput Chat</strong>
                    <span>Live group chat</span>
                </div>
            </div>
            <button id="chat-minimize-btn" type="button" aria-label="Close chat">×</button>
        </div>

        <div id="chat-messages"></div>

        <div id="chat-form-area">
            <!-- ATTACHMENT MENU -->
            <div id="attachment-menu">
                <button id="att-media" type="button">🖼️ Photo / Video</button>
                <button id="att-doc" type="button">📄 Document</button>
                <button id="att-audio" type="button">🎵 Audio</button>
            </div>

            <!-- EMOJI -->
            <div id="emoji-picker-container">
                <emoji-picker id="emojiPicker"></emoji-picker>
            </div>

            <form id="chatForm">
                <button id="chat-attach-btn" class="chat-icon-btn" type="button" title="Attach" aria-label="Attach">＋</button>
                <button id="emojiButton" class="chat-icon-btn" type="button" title="Emoji" aria-label="Emoji">☺</button>
                <input id="chatInput" type="text" autocomplete="off" maxlength="1000" placeholder="Type a message...">
                <button id="voiceButton" class="chat-icon-btn" type="button" title="Voice message" aria-label="Voice message">🎙️</button>
                <button id="chat-send" type="submit" title="Send" aria-label="Send">➤</button>
            </form>
            <input id="chatAttachment" type="file" hidden>
        </div>
    </div>

    <!-- JOIN SCREEN -->
    <div id="join-screen">
        <div class="join-card">
            <div class="join-logo">📍</div>
            <h1>Welcome to Live Map</h1>
            <p>Enter your name to join the live map, memories and chat.</p>
            <form id="join-form">
                <input id="nameInput" type="text" maxlength="40" autocomplete="name" placeholder="Your name" required>
                <label class="avatar-upload" for="avatarInput">
                    <span id="avatar-label-text">Choose profile photo</span>
                </label>
                <input id="avatarInput" type="file" accept="image/*">
                <button id="join-submit" type="submit">Enter Map</button>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>

</body>
</html>
