<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koraput Map - Realtime Tracking</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Main Custom CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- GOOGLE PLACES API (With your exact API Key) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCNvtohdc8leYRLcQuMgVQPLiexPumxw5c&libraries=places" defer></script>

    <!-- GOOGLE AUTOCOMPLETE DARK THEME CSS -->
    <style>
      .pac-container { z-index: 9999 !important; background: #071018 !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 14px !important; box-shadow: 0 12px 40px rgba(0,0,0,0.6) !important; margin-top: 8px; font-family: inherit !important; }
      .pac-item { border-top: 1px solid rgba(255, 255, 255, 0.05) !important; color: #8d9ba2 !important; padding: 12px 16px !important; cursor: pointer !important; }
      .pac-item:hover, .pac-item.pac-item-selected { background: rgba(59, 130, 246, 0.15) !important; }
      .pac-item-query { color: #fff !important; font-size: 14px !important; font-weight: 600 !important; margin-right: 5px; }
      .pac-icon { display: none !important; }
    </style>
</head>
<body>

    <!-- Join Screen -->
    <div id="join-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#071018; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h2>Join Map</h2>
        <form id="join-form" style="display:flex; flex-direction:column; gap:15px; width:80%; max-width:300px;">
            <input type="text" id="nameInput" placeholder="Your Name" required style="padding:10px; border-radius:8px;">
            <input type="file" id="avatarInput" accept="image/*" style="color:white;">
            <button type="submit" style="padding:10px; background:#18d6a3; border:none; border-radius:8px; font-weight:bold;">Join</button>
        </form>
    </div>

    <!-- App Header -->
    <header class="app-header" style="position:absolute; top:10px; left:10px; z-index:1000; display:flex; gap:10px; background:rgba(0,0,0,0.6); padding:10px; border-radius:10px;">
        <img id="header-avatar" src="" style="display:none; width:35px; height:35px; border-radius:50%;">
        <div class="header-info">
            <h3 id="header-app-title" style="color:white; margin:0; font-size:14px;">Map Tracker</h3>
            <div class="header-badges" style="display:flex; gap:5px; margin-top:2px;">
                <span id="pill-city" class="badge" style="color:#18d6a3; font-size:10px;">📍 Locating...</span>
                <span id="map-temp-display" class="badge" style="color:#f59e0b; font-size:10px;">🌤️ --°C</span>
            </div>
        </div>
    </header>

    <!-- Google Maps Search Bar Integration -->
    <div class="search-container" style="position:absolute; top:70px; left:10px; z-index:1000; width:calc(100% - 20px); max-width:400px; display:flex;">
        <input type="text" id="location-search-input" placeholder="Search Google Maps..." autocomplete="off" style="width:100%; padding:12px; border-radius:8px; border:none;">
        <button id="location-search-clear" style="display:none; position:absolute; right:10px; top:10px; border:none; background:none; cursor:pointer;">✖</button>
    </div>

    <!-- Map Container -->
    <div id="map" style="width:100vw; height:100vh;"></div>

    <!-- Floating Action Buttons & Tools -->
    <div id="tools-menu" style="display:none; position:absolute; right:10px; bottom:80px; flex-direction:column; gap:10px; z-index:1000;">
        <button id="measure-btn" class="tool-option">📏 Measure</button>
        <button id="geofence-btn" class="tool-option">⭕ Geofence</button>
        <button id="trip-btn" class="tool-option">🚗 Trip</button>
        <button id="group-nav-btn" class="tool-option">🗺️ Group Nav</button>
        <button id="map-style-btn" class="tool-option">🌍 Map Style</button>
    </div>
    
    <div style="position:absolute; right:10px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:1000;">
        <button id="main-tools-btn" style="padding:10px; border-radius:50%; background:#3b82f6; border:none;">🛠️</button>
        <button id="my-location-btn" style="padding:10px; border-radius:50%; background:#18d6a3; border:none;">🎯</button>
        <button id="compass-btn" style="padding:10px; border-radius:50%; background:#fff; border:none;">🧭</button>
        <button id="phase3-gallery-btn" style="padding:10px; border-radius:50%; background:#ec4899; border:none;">📸</button>
        <button id="chat-toggle-btn" style="padding:10px; border-radius:50%; background:#8b5cf6; border:none;">💬 <span id="chat-unread-badge" style="display:none; position:absolute; top:0; right:0; background:red; border-radius:50%; font-size:10px; padding:2px 4px;">0</span></button>
    </div>

    <!-- Map Style Menu -->
    <div id="map-style-menu" style="display:none; position:absolute; right:60px; bottom:140px; background:#fff; padding:10px; border-radius:8px; z-index:1000;">
        <button data-style="satellite">Satellite</button>
        <button data-style="street">Street</button>
        <button data-style="dark">Dark</button>
    </div>

    <!-- Friends List Container -->
    <div id="friends-list" style="position:absolute; bottom:20px; left:10px; z-index:1000; display:flex; flex-direction:column; gap:5px;"></div>

    <!-- Profile Popup -->
    <div id="profile-popup" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#071018; padding:20px; border-radius:12px; z-index:10000; color:white; text-align:center;">
        <button id="profile-popup-close" style="position:absolute; top:5px; right:5px; background:none; border:none; color:white;">✖</button>
        <img id="profile-popup-avatar" src="" style="width:60px; height:60px; border-radius:50%; margin-bottom:10px;">
        <h3 id="profile-popup-name" style="margin:0;"></h3>
        <p id="profile-popup-status" style="margin:5px 0; font-size:12px;"></p>
        <p id="profile-popup-distance" style="margin:5px 0; font-size:12px; color:#18d6a3;"></p>
        <div style="display:flex; justify-content:center; gap:10px; margin-top:15px;">
            <button id="profile-nav-btn" style="background:#3b82f6; border:none; padding:8px 15px; border-radius:8px; color:white;">Navigate</button>
            <button id="profile-focus-btn" style="background:#18d6a3; border:none; padding:8px 15px; border-radius:8px; color:white;">Focus Map</button>
        </div>
    </div>

    <!-- Location Bottom Sheet -->
    <div id="location-bottom-sheet" class="bottom-sheet" style="position:absolute; bottom:0; left:0; width:100%; background:#071018; padding:20px; border-radius:20px 20px 0 0; z-index:1000; transform:translateY(120%); transition:transform 0.3s; color:white; box-sizing:border-box;">
        <h3 id="sheet-title" style="margin:0 0 5px 0;">Location</h3>
        <p id="sheet-address" style="margin:0 0 15px 0; color:var(--muted); font-size:12px;">Address details</p>
        <div class="sheet-actions" style="display:flex; gap:10px;">
            <button id="search-direction-btn" style="flex:1; padding:10px; background:#3b82f6; border:none; border-radius:8px; color:white;">🗺️ Preview Route</button>
            <button id="search-start-btn" style="flex:1; padding:10px; background:#18d6a3; border:none; border-radius:8px; color:white;">🚀 Start Navigation</button>
        </div>
    </div>

    <!-- Navigation Panel -->
    <div id="nav-panel" class="nav-panel" style="display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; background:#071018; border-radius:12px; padding:15px; z-index:1000; color:white; flex-direction:column; gap:10px; box-sizing:border-box;">
        <div class="nav-header" style="display:flex; justify-content:space-between; border-bottom:1px solid #333; padding-bottom:10px;">
            <span id="nav-target-name" style="font-weight:bold;">Destination</span>
            <button id="nav-exit-btn" style="background:none; border:none; color:#ef4444;">✖ Exit</button>
        </div>
        <div class="nav-stats" style="display:flex; justify-content:space-between; font-size:18px; font-weight:bold;">
            <span id="nav-time" style="color:#18d6a3;">-- min</span>
            <span id="nav-dist" style="color:#f59e0b;">-- km</span>
        </div>
        <div class="nav-instruction" style="display:flex; gap:15px; align-items:center;">
            <div id="nav-inst-arrow" style="font-size:24px;">↑</div>
            <div>
                <div id="nav-inst-text" style="font-size:14px;">Calculating...</div>
                <div id="nav-instruction-sub" style="font-size:12px; color:#888;"></div>
            </div>
        </div>
        <button id="nav-recalc-btn" style="background:#333; border:none; padding:8px; border-radius:8px; color:white;">↻ Recalculate</button>
    </div>

    <!-- Group Navigation & Trip Panels -->
    <div id="group-nav-setup" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#071018; padding:20px; border-radius:12px; z-index:10000; color:white; flex-direction:column; gap:15px; min-width:250px;">
        <h3>Select Friends</h3>
        <div id="group-nav-friend-list" style="display:flex; flex-direction:column; gap:10px; max-height:200px; overflow-y:auto;"></div>
        <div style="display:flex; justify-content:space-between;">
            <button id="group-nav-close-btn" style="background:#333; border:none; padding:8px 15px; border-radius:8px; color:white;">Cancel</button>
            <button id="group-nav-next-btn" style="background:#18d6a3; border:none; padding:8px 15px; border-radius:8px; color:white;">Start</button>
        </div>
    </div>

    <div id="group-nav-active" style="display:none; position:absolute; right:10px; top:70px; background:rgba(7,16,24,0.9); padding:15px; border-radius:12px; z-index:1000; color:white; flex-direction:column; gap:10px; width:200px;">
        <h4 style="margin:0;">Group Nav</h4>
        <div id="group-nav-stats-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button id="group-nav-stop-btn" style="background:#ef4444; border:none; padding:8px; border-radius:8px; color:white;">Stop Group Nav</button>
    </div>

    <div id="trip-panel" style="display:none; position:absolute; left:10px; bottom:80px; background:rgba(7,16,24,0.9); padding:15px; border-radius:12px; z-index:1000; color:white; flex-direction:column; gap:10px; width:200px;">
        <h4 id="trip-title" style="margin:0;">Trip</h4>
        <div id="trip-members-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <button id="trip-action-btn" style="background:#18d6a3; border:none; padding:8px; border-radius:8px; color:white;">Action</button>
    </div>

    <!-- Geofence List Modal -->
    <div id="geofence-list-modal" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:#071018; padding:20px; border-radius:12px; z-index:10000; color:white; flex-direction:column; gap:15px; width:80%; max-width:300px;">
        <h3 style="margin:0;">Active Geofences</h3>
        <div id="geofence-items" style="display:flex; flex-direction:column; gap:10px; max-height:250px; overflow-y:auto;"></div>
        <button id="geofence-list-close" style="background:#333; border:none; padding:8px; border-radius:8px; color:white;">Close</button>
    </div>

    <!-- Chat & Memories -->
    <div id="chat-container" style="display:none; position:absolute; bottom:0; left:0; width:100%; height:60vh; background:#071018; z-index:10000; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; padding:10px; background:#111;">
            <h3 style="margin:0; color:white;">Chat</h3>
            <button id="chat-minimize-btn" style="background:none; border:none; color:white;">▼</button>
        </div>
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; color:white;"></div>
        <div id="reply-bar" style="display:none; background:#222; padding:5px 10px; color:white; justify-content:space-between;">
            <span id="reply-preview"></span>
            <button id="reply-cancel" style="background:none; border:none; color:white;">✖</button>
        </div>
        <form id="chatForm" style="display:flex; padding:10px; background:#111; gap:10px;">
            <button type="button" id="emojiButton" style="background:none; border:none; color:white; font-size:20px;">😊</button>
            <button type="button" id="chat-attach-btn" style="background:none; border:none; color:white; font-size:20px;">📎</button>
            <input type="text" id="chatInput" placeholder="Message..." style="flex:1; padding:10px; border-radius:20px; border:none;">
            <input type="file" id="chatFileInput" style="display:none;">
            <button type="button" id="voiceButton" style="background:none; border:none; font-size:20px;">🎙️</button>
            <button type="submit" id="chat-send" style="display:none; background:#18d6a3; border:none; border-radius:50%; width:40px; height:40px; color:white;">➤</button>
        </form>
        <!-- Menus -->
        <div id="emoji-picker-container" style="display:none; position:absolute; bottom:60px; left:10px;">
            <emoji-picker id="emojiPicker"></emoji-picker>
        </div>
        <div id="attachment-menu" style="display:none; position:absolute; bottom:60px; left:50px; background:#222; padding:10px; border-radius:8px; flex-direction:column; gap:10px;">
            <button type="button" id="att-media" style="background:none; border:none; color:white;">📷 Photo/Video</button>
            <button type="button" id="att-doc" style="background:none; border:none; color:white;">📄 Document</button>
            <button type="button" id="att-audio" style="background:none; border:none; color:white;">🎵 Audio</button>
        </div>
    </div>

    <div id="phase3-memory-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:#071018; z-index:10000; overflow-y:auto; color:white; padding:20px; box-sizing:border-box;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Memories <span id="phase3-memory-count" style="font-size:12px; color:#888;"></span></h2>
            <button id="phase3-memory-close" style="background:none; border:none; color:white; font-size:20px;">✖</button>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="phase3-filter active" data-filter="all">All</button>
            <button class="phase3-filter" data-filter="today">Today</button>
            <button class="phase3-filter" data-filter="mine">Mine</button>
        </div>
        <input type="text" id="phase3-memory-search" placeholder="Search memories..." style="width:100%; padding:10px; border-radius:8px; border:none; margin-bottom:15px; box-sizing:border-box;">
        <button id="p3-add-memory-btn" style="width:100%; padding:12px; background:#ec4899; border:none; border-radius:8px; color:white; margin-bottom:15px; font-weight:bold;">📸 Add New Memory</button>
        <input type="file" id="memoryPhotoInput" accept="image/*" style="display:none;">
        <div id="phase3-memory-empty" style="display:none; text-align:center; color:#888; margin-top:20px;">No memories found.</div>
        <div id="phase3-memory-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px;"></div>
        <div id="phase3-timeline-list" style="display:flex; flex-direction:column; gap:10px; margin-top:20px;"></div>
    </div>

    <div id="phase3-photo-viewer" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10001; flex-direction:column; align-items:center; justify-content:center; color:white;">
        <button id="p3-view-close" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:24px;">✖</button>
        <img id="p3-view-image" src="" style="max-width:90%; max-height:70%; border-radius:12px;">
        <h3 id="p3-view-name" style="margin:15px 0 5px 0;"></h3>
        <p id="p3-view-date" style="color:#aaa; margin:0 0 15px 0;"></p>
        <button id="p3-view-focus" style="padding:10px 20px; background:#18d6a3; border:none; border-radius:8px; color:white;">📍 View on Map</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:10000; display:flex; flex-direction:column; gap:10px; pointer-events:none;"></div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    
    <!-- Main Logic -->
    <script src="app.js"></script>

</body>
</html>
