<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koraput Map</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #0b141a; 
        }

        #map { 
            position: fixed; 
            inset: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 1; 
        }

        /* =========================
           TOP-LEFT CAMERA BUTTON
        ========================= */
        #memoryButton {
            position: fixed !important;
            top: calc(env(safe-area-inset-top, 0px) + 20px) !important;
            left: 20px !important;
            width: 50px !important;
            height: 50px !important;
            border-radius: 50% !important;
            background: #111b21 !important;
            border: 2px solid #00a884 !important;
            color: #fff !important;
            font-size: 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6) !important;
            z-index: 99999 !important;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        #memoryButton:active { transform: scale(0.92); }
        #memoryPhotoInput { display: none; }

        /* =========================
           JOIN SCREEN OVERLAY
        ========================= */
        #join-screen {
            position: fixed; 
            inset: 0; 
            z-index: 9999; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: rgba(11, 20, 26, 0.85); 
            backdrop-filter: blur(6px);
        }
        .join-box {
            width: min(90%, 360px); 
            padding: 26px; 
            border-radius: 16px; 
            background: #111b21; 
            color: #e9edef;
            border: 1px solid #222d34; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            text-align: center;
        }
        .join-box h2 { font-size: 22px; margin-bottom: 6px; }
        .join-box p { font-size: 13px; color: #8696a0; margin-bottom: 20px; }
        .join-box input[type="text"] {
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #2a3942;
            background: #202c33; 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            margin-bottom: 14px;
        }
        .avatar-label {
            display: block; 
            padding: 12px; 
            border: 1px dashed #374248; 
            border-radius: 8px;
            font-size: 13px; 
            color: #8696a0; 
            cursor: pointer; 
            margin-bottom: 20px;
        }
        .avatar-label input { display: none; }
        .join-box button {
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            background: #00a884;
            color: #111b21; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
        }

        /* =========================
           CHAT TOGGLE (FLOATING BUTTON)
        ========================= */
        #chat-toggle-btn {
            position: fixed !important;
            right: 20px !important;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 80px) !important;
            width: 58px !important;
            height: 58px !important;
            border-radius: 50% !important;
            background: #00a884 !important;
            color: #fff !important;
            border: none !important;
            font-size: 28px !important;
            display: none;
            align-items: center !important;
            justify-content: center !important;
            box-shadow: 0 6px 25px rgba(0,0,0,0.55) !important;
            cursor: pointer !important;
            z-index: 99999 !important;
            -webkit-tap-highlight-color: transparent;
        }
        #chat-toggle-btn:active { transform: scale(0.92); }

        /* =========================
           WHATSAPP CHAT CONTAINER
        ========================= */
        #chat-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 360px;
            height: 540px;
            max-width: calc(100vw - 32px);
            max-height: calc(100dvh - 32px);
            display: none;
            flex-direction: column;
            background: #0b141a;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            border: 1px solid #222d34;
            z-index: 99999;
        }

        /* WHATSAPP HEADER */
        #chat-header {
            height: 60px;
            background: #202c33;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            flex-shrink: 0;
        }
        #chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #00a884;
        }
        .header-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .header-info span:first-child {
            font-size: 15px;
            font-weight: 600;
            color: #e9edef;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-info span:last-child {
            font-size: 11px;
            color: #00a884;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: #aebac1;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        /* MESSAGES LIST */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: #0b141a;
            background-image: radial-gradient(#111b21 1px, transparent 1px);
            background-size: 16px 16px;
        }
        .msg-bubble {
            max-width: 80%;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.4;
            color: #e9edef;
            word-break: break-word;
        }
        .msg-mine {
            align-self: flex-end;
            background: #005c4b;
            border-top-right-radius: 0;
        }
        .msg-theirs {
            align-self: flex-start;
            background: #202c33;
            border-top-left-radius: 0;
        }
        .msg-sender {
            font-size: 11px;
            font-weight: bold;
            color: #53bdeb;
            margin-bottom: 2px;
        }

        /* CHAT INPUT AREA */
        #chatForm {
            height: 56px;
            background: #202c33;
            display: flex;
            align-items: center;
            padding: 6px 10px;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
        }
        .input-icon {
            background: transparent;
            border: none;
            color: #8696a0;
            font-size: 20px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #chatInput {
            flex: 1;
            height: 38px;
            background: #2a3942;
            border: none;
            outline: none;
            border-radius: 20px;
            padding: 0 14px;
            color: #e9edef;
            font-size: 14px;
            min-width: 0;
        }
        #chatInput::placeholder { color: #8696a0; }
        .action-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #00a884;
            border: none;
            color: #111b21;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* POPUP MENUS */
        #attachment-menu {
            position: absolute;
            left: 10px;
            bottom: 64px;
            background: #233138;
            border-radius: 12px;
            padding: 6px;
            display: none;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid #2a3942;
            z-index: 5000;
        }
        #attachment-menu button {
            background: transparent;
            border: none;
            color: #d1d7db;
            padding: 10px 14px;
            text-align: left;
            font-size: 13.5px;
            cursor: pointer;
            border-radius: 6px;
        }
        #attachment-menu button:hover { background: #182229; }
        #emoji-picker-container {
            position: absolute; 
            left: 10px; 
            bottom: 64px; 
            display: none; 
            z-index: 5000;
        }
        emoji-picker { width: 310px; height: 320px; }

        /* MARKERS & WEATHER BADGE */
        .avatar-marker {
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 3px solid #00a884;
            background: #fff; 
            overflow: hidden; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        .avatar-marker.friend { border-color: #53bdeb; }
        .avatar-marker img { width: 100%; height: 100%; object-fit: cover; }
        .memory-pin-box {
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 3px solid #ea4335;
            background: #fff; 
            overflow: hidden; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        .memory-pin-box img { width: 100%; height: 100%; object-fit: cover; }
        .weather-badge {
            background: #111b21 !important; 
            border: 1px solid #00a884 !important; 
            color: #fff !important;
            border-radius: 6px !important; 
            font-size: 11px !important; 
            padding: 2px 6px !important; 
            font-weight: bold !important;
        }

        @media (max-width: 600px) {
            #chat-container {
                left: 0; 
                right: 0; 
                bottom: 0; 
                width: 100vw; 
                height: 100vh; 
                height: 100dvh;
                max-width: none; 
                max-height: none; 
                border-radius: 0;
            }
            #chat-header { 
                padding-top: env(safe-area-inset-top); 
                height: calc(60px + env(safe-area-inset-top)); 
            }
            #chatForm { 
                padding-bottom: max(6px, env(safe-area-inset-bottom)); 
                height: calc(56px + env(safe-area-inset-bottom)); 
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <button id="memoryButton" title="Pin Memory Photo">📸</button>
    <input type="file" id="memoryPhotoInput" accept="image/*">

    <button id="chat-toggle-btn">💬</button>

    <div id="chat-container">
        <div id="chat-header">
            <img id="header-avatar" src="satyam.png" alt="Avatar">
            <div class="header-info">
                <span id="chat-user-title">Koraput Group</span>
                <span>online</span>
            </div>
            <div class="header-actions">
                <button id="chat-minimize-btn" title="Minimize">−</button>
            </div>
        </div>

        <div id="chat-messages"></div>

        <form id="chatForm">
            <div id="attachment-menu">
                <button type="button" id="att-media">🖼️ Photo / Video</button>
                <button type="button" id="att-doc">📄 Document</button>
                <button type="button" id="att-audio">🎵 Audio</button>
            </div>
            <div id="emoji-picker-container">
                <emoji-picker id="emojiPicker"></emoji-picker>
            </div>

            <button type="button" id="emojiButton" class="input-icon">😊</button>
            <button type="button" id="chat-attach-btn" class="input-icon">📎</button>
            
            <input type="text" id="chatInput" placeholder="Message" autocomplete="off">
            <input type="file" id="chatAttachment" hidden>
            
            <button type="button" id="voiceButton" class="action-circle-btn">🎤</button>
            <button type="submit" id="chat-send" class="action-circle-btn" style="display: none;">➤</button>
        </form>
    </div>

    <div id="join-screen">
        <div class="join-box">
            <h2>Koraput Map</h2>
            <p>Join squad map and live tracker</p>
            <form id="join-form">
                <input type="text" id="nameInput" placeholder="Your Name" maxlength="30" required>
                <label class="avatar-label">
                    <span id="avatar-label-text">Select Profile Photo</span>
                    <input type="file" id="avatarInput" accept="image/*">
                </label>
                <button type="submit">Join Squad</button>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
