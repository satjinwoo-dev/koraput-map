<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#071018">
    <title>Koraput Live Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --bg: #071018; --border: rgba(255, 255, 255, 0.10); --green: #10b981; --green-bright: #18d6a3; --blue: #3b82f6; --text: #f5f7f8; --muted: #8d9ba2; --shadow: 0 12px 40px rgba(0, 0, 0, 0.55); }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
        button, input { font: inherit; outline: none; cursor: pointer; } input { cursor: text; }

        #map { position: fixed; inset: 0; z-index: 1; }
        .leaflet-control-attribution { display: none; }

        #top-header { position: fixed; top: 14px; left: 14px; right: 14px; z-index: 1000; display: flex; justify-content: space-between; pointer-events: none; }
        .brand-card { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 9px 13px; background: rgba(7, 16, 24, 0.88); border: 1px solid var(--border); border-radius: 15px; backdrop-filter: blur(14px); box-shadow: var(--shadow); }
        .brand-dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 14px var(--green-bright); }
        .header-info { display: flex; flex-direction: column; line-height: 1.1; }
        .header-info strong { font-size: 13px; font-weight: 750; }
        .header-info span { margin-top: 3px; color: var(--muted); font-size: 9px; }
        #header-avatar { display: none; width: 34px; height: 34px; object-fit: cover; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.18); }

        /* SEARCH BAR */
        #location-search-wrap { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 3000; width: min(430px, calc(100vw - 110px)); }
        #location-search { display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; background:rgba(7,16,24,.96); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); backdrop-filter:blur(16px); }
        #location-search-icon { font-size:17px; opacity:.85; }
        #location-search-input { flex:1; min-width:0; border:0; background:transparent; color:white; font-size:13px; padding:6px 0; }
        #location-search-input::placeholder { color:#8d9ba2; }
        #location-search-clear { display:none; border:0; background:transparent; color:#9aa8ae; font-size:18px; padding:3px 5px; }
        #location-search-results { display:none; margin-top:7px; overflow:hidden; border:1px solid var(--border); border-radius:15px; background:rgba(7,16,24,.97); box-shadow:var(--shadow); backdrop-filter:blur(16px); max-height: 250px; overflow-y: auto; }
        .search-result { display:block; width:100%; padding:11px 13px; border:0; border-bottom:1px solid rgba(255,255,255,.07); background:transparent; color:white; text-align:left; cursor:pointer; }
        .search-result:last-child { border-bottom:0; }
        .search-result:hover { background:rgba(16,185,129,.12); }
        .search-result-name { display:block; font-size:12px; font-weight:750; }
        .search-result-address { display:block; margin-top:3px; color:var(--muted); font-size:10px; line-height:1.35; }
        
        #search-place-card { display:none; margin-top:7px; padding:13px; border:1px solid var(--border); border-radius:15px; background:rgba(7,16,24,.97); box-shadow:var(--shadow); backdrop-filter:blur(16px); }
        #search-place-name { color:white; font-size:14px; font-weight:800; }
        #search-place-address { margin-top:4px; color:var(--muted); font-size:10px; line-height:1.4; }
        .search-place-actions { display:flex; gap:8px; margin-top:11px; }
        .search-place-actions button { flex:1; border:0; border-radius:10px; padding:10px 8px; font-size:11px; font-weight:800; }
        #search-direction-btn { background:rgba(59,130,246,.2); color:#60a5fa; }
        #search-start-btn { background:var(--green); color:white; }
        .search-loading { padding:13px; color:var(--muted); font-size:11px; text-align:center; }

        /* TRUE NAVIGATION PANEL (Google Maps Style) */
        #nav-panel { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 2000; width: min(340px, 92vw); background: rgba(7, 16, 24, 0.96); border: 1px solid var(--border); border-radius: 18px; padding: 18px; backdrop-filter: blur(16px); box-shadow: var(--shadow); display: none; flex-direction: column; }
        #nav-target-name { margin: 0 0 10px 0; font-size: 16px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-stats-pills { display: flex; gap: 8px; margin-bottom: 12px; }
        .nav-pill { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: white; }
        .nav-pill-time { color: var(--green-bright); background: rgba(24, 214, 163, 0.15); }
        #nav-instruction { font-size: 16px; font-weight: 700; color: white; margin: 10px 0 16px 0; display: flex; align-items: center; gap: 10px; }
        #nav-instruction-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }
        #nav-exit-btn { background: rgba(255,255,255,0.08); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 12px; width: 100%; transition: 0.2s; }
        #nav-exit-btn:hover { background: #ef4444; }

        /* FRIENDS PANEL (Bottom/Side Panel) */
        #friends-panel { position: fixed; right: 14px; top: 75px; z-index: 1000; width: 180px; background: rgba(7, 16, 24, 0.92); border: 1px solid var(--border); border-radius: 15px; padding: 12px; backdrop-filter: blur(14px); box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 250px; }
        .friends-header { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 1px; margin-bottom: 10px; }
        #friends-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .friend-list-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .friend-list-item:hover { background: rgba(255,255,255,0.08); }
        .friend-list-item img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
        .friend-info-col { display: flex; flex-direction: column; }
        .friend-list-name { font-size: 12px; font-weight: bold; color: white; }
        .friend-list-dist { font-size: 10px; color: var(--muted); }
        .status-dot-small { width: 6px; height: 6px; border-radius: 50%; background: var(--green-bright); margin-left: auto; }

        /* UNIFIED MAP TOOLS */
        #tools-container { position: fixed; right: 14px; bottom: 80px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .map-tool-button { width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 50%; background: rgba(7, 16, 24, 0.95); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(14px); box-shadow: var(--shadow); transition: transform 0.15s; }
        #tools-menu { display: none; flex-direction: column; gap: 6px; background: rgba(7, 16, 24, 0.95); border: 1px solid var(--border); padding: 8px; border-radius: 14px; backdrop-filter: blur(14px); margin-bottom: 5px; }
        .tool-option { border: none; background: transparent; color: white; font-size: 12px; font-weight: bold; padding: 8px 12px; text-align: left; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        .tool-option:hover, .tool-option.active-tool { background: rgba(16, 185, 129, 0.2); color: var(--green-bright); }

        #bottom-info { position: fixed; left: 50%; bottom: 17px; transform: translateX(-50%); z-index: 1000; display: flex; gap: 7px; pointer-events: none; }
        .bottom-pill { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; background: rgba(7, 16, 24, 0.9); color: #e9eef0; font-size: 11px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(14px); box-shadow: 0 8px 25px rgba(0,0,0,0.35); }
        .bottom-pill.live { color: var(--green-bright); }

        /* Existing UI Elements (Chat, Memory Button, Modals) */
        #memoryButton, #chat-toggle-btn { position: fixed; bottom: 17px; z-index: 1200; width: 48px; height: 48px; border: 1px solid var(--border); background: rgba(7, 16, 24, 0.94); color: white; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); backdrop-filter: blur(14px); border-radius: 50%; font-size: 20px; transition: transform 0.15s; }
        #memoryButton { left: 16px; }
        #chat-toggle-btn { right: 16px; }
        #chat-unread-badge { position: absolute; right: -2px; top: -2px; display: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #ef4444; color: white; font-size: 9px; font-weight: 700; align-items: center; justify-content: center; }

        /* ... All other Modals (Chat Container, Profile Popup, Join Screen, Group Nav Setup) remain identical to save space, assuming they are in your code ... */
        /* To keep the payload lean, I've kept the essential layout styling. Make sure to keep your existing modal CSS. */
        
        #profile-popup { position: fixed; inset: 0; z-index: 5500; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,0.45); backdrop-filter: blur(5px); }
        .profile-card { position: relative; width: min(310px, 92vw); padding: 22px; border: 1px solid var(--border); border-radius: 20px; background: rgba(7, 16, 24, 0.98); box-shadow: 0 25px 80px rgba(0,0,0,0.65); text-align: center; }
        #profile-popup-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.07); color: white; font-size: 20px; }
        .profile-avatar-wrap { width: 82px; height: 82px; padding: 3px; margin: 4px auto 12px; border-radius: 50%; background: var(--green); }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-name { margin: 0; color: white; font-size: 20px; font-weight: 700; }
        .profile-status { margin-top: 5px; font-size: 13px; font-weight: 600; }
        .profile-info { margin-top: 18px; display: grid; gap: 8px; }
        .profile-row { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: #17242b; font-size: 13px; }
        .profile-actions { display: flex; gap: 8px; margin-top: 14px; }
        .profile-actions button { flex: 1; padding: 11px; border: 0; border-radius: 10px; font-weight: 700; color: white; cursor: pointer; }
        #profile-nav-btn { background: #3b82f6; } 
        #profile-focus-btn { background: var(--green); }

        .nav-path-animated { stroke-dasharray: 15, 15; animation: navFlow 1s linear infinite; }
        @keyframes navFlow { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
        .custom-own-icon div { animation: radar 2s infinite; }
        @keyframes radar { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.7); } 70% { box-shadow: 0 0 0 16px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }

        /* Minimal mobile adjustments */
        @media(max-width: 600px) {
            #location-search-wrap { top: 65px; width: calc(100vw - 20px); }
            #nav-panel { top: 122px; width: calc(100vw - 20px); }
            #friends-panel { display: none; /* Hide side panel on very small screens, rely on markers */ }
            #tools-container { bottom: 80px; }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>
<div id="map"></div>

<!-- TOP HEADER -->
<div id="top-header">
    <div class="brand-card">
        <div class="brand-dot"></div>
        <div class="header-info">
            <strong id="header-app-title">Koraput Map</strong>
            <span>Real-time Location</span>
        </div>
        <img id="header-avatar" src="satyam.png" alt="Profile">
    </div>
</div>

<!-- GOOGLE MAPS STYLE SEARCH -->
<div id="location-search-wrap">
    <div id="location-search">
        <span id="location-search-icon">🔎</span>
        <input id="location-search-input" type="search" autocomplete="off" placeholder="Search a place or location...">
        <button id="location-search-clear" type="button" aria-label="Clear search">×</button>
    </div>
    <div id="location-search-results"></div>
    <div id="search-place-card">
        <div id="search-place-name">Location</div>
        <div id="search-place-address">Address</div>
        <div class="search-place-actions">
            <button id="search-direction-btn" type="button">🛤️ Directions</button>
            <button id="search-start-btn" type="button">🧭 Start navigation</button>
        </div>
    </div>
</div>

<!-- TRUE NAVIGATION PANEL (UI Update) -->
<div id="nav-panel">
    <h3 id="nav-target-name">Destination</h3>
    <div class="nav-stats-pills">
        <span class="nav-pill nav-pill-time" id="nav-time">-- min</span>
        <span class="nav-pill" id="nav-dist">-- km</span>
    </div>
    <div id="nav-instruction">
        <span id="nav-inst-arrow">↗</span> 
        <div>
            <span id="nav-inst-text">Calculating best route...</span>
            <div id="nav-instruction-sub"></div>
        </div>
    </div>
    <button id="nav-exit-btn">Exit navigation</button>
</div>

<!-- FRIENDS PANEL (Side Panel) -->
<div id="friends-panel">
    <div class="friends-header">FRIENDS ONLINE</div>
    <div id="friends-list"></div>
</div>

<!-- UNIFIED TOOLS MENU -->
<div id="tools-container">
    <div id="tools-menu">
        <button id="measure-btn" class="tool-option">📏 Measure Distance</button>
        <button id="geofence-btn" class="tool-option">⭕ Geofence</button>
        <button id="group-nav-btn" class="tool-option">🗺️ Group Navigation</button>
        <button id="phase3-gallery-btn" class="tool-option">🖼️ Memory Gallery</button>
    </div>
    <button id="main-tools-btn" class="map-tool-button">⚙️</button>
</div>

<!-- BOTTOM INFO PILLS -->
<div id="bottom-info">
    <div class="bottom-pill" id="pill-city">📍 Locating…</div>
    <div class="bottom-pill">🌡️ <span id="map-temp-display">--°C</span></div>
    <div class="bottom-pill live">● Live</div>
</div>

<button id="memoryButton" type="button" title="Add memory">📸</button>
<input id="memoryPhotoInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

<!-- PROFILE POPUP -->
<div id="profile-popup">
    <div class="profile-card">
        <button id="profile-popup-close">×</button>
        <div class="profile-avatar-wrap"><img id="profile-popup-avatar" class="profile-avatar" src="" alt="Avatar"></div>
        <h2 id="profile-popup-name" class="profile-name">Friend</h2>
        <div id="profile-popup-status" class="profile-status">● Online</div>
        <div class="profile-info">
            <div class="profile-row"><span>📍 Distance</span><strong id="profile-popup-distance">--</strong></div>
            <div class="profile-row"><span>☁️ Weather</span><strong id="profile-popup-weather">--</strong></div>
        </div>
        <div class="profile-actions">
            <button id="profile-nav-btn" type="button">🧭 Navigate</button>
            <button id="profile-focus-btn" type="button">📍 Focus</button>
        </div>
    </div>
</div>

<!-- MINIMAL JOIN SCREEN -->
<div id="join-screen">
    <div class="join-card">
        <div class="join-logo">📍</div>
        <h1>Welcome to Koraput Map</h1>
        <p>Live map, realtime friends & navigation.</p>
        <form id="join-form">
            <input id="nameInput" maxlength="40" autocomplete="name" placeholder="Your name" required>
            <label class="avatar-upload" for="avatarInput">Choose profile photo</label>
            <input id="avatarInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <button id="join-submit" type="submit">Enter Map</button>
        </form>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
