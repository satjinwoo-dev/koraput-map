<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Koraput Map</title>

    <!-- Google 3D Maps -->
    <script
        src="https://maps.googleapis.com/maps/api/js?loading=async&key=YOUR_GOOGLE_MAPS_API_KEY&libraries=maps3d"
        defer>
    </script>

    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        /* =====================================
           GOOGLE 3D MAP
        ===================================== */

        #map {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
        }

        /* =====================================
           UI LAYER
        ===================================== */

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            pointer-events: none;
        }

        button,
        input,
        label,
        .clickable {
            pointer-events: auto;
        }

        /* =====================================
           JOIN SCREEN
        ===================================== */

        #join-screen {
            position: fixed;
            inset: 0;
            z-index: 5000;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);

            pointer-events: auto;
        }

        #join-box {
            width: min(90%, 380px);
            padding: 25px;
            border-radius: 18px;

            background: #111b21;
            color: white;

            box-shadow: 0 10px 40px rgba(0,0,0,.6);
        }

        #join-box h2 {
            margin-top: 0;
            text-align: center;
        }

        #nameInput,
        #avatarInput {
            width: 100%;
            margin-top: 10px;
            margin-bottom: 15px;
            padding: 13px;

            border: 1px solid #37474f;
            border-radius: 10px;

            background: #202c33;
            color: white;
        }

        #join-form button {
            width: 100%;
            padding: 13px;

            border: 0;
            border-radius: 10px;

            background: #00a884;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* =====================================
           MEMORY BUTTON
        ===================================== */

        #memoryButton {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            left: 15px;

            width: 48px;
            height: 48px;

            border-radius: 50%;
            border: 2px solid #00a884;

            background: #111b21;
            color: white;

            font-size: 23px;
            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0,0,0,.5);

            z-index: 2000;
        }

        #memoryPhotoInput {
            display: none;
        }

        /* =====================================
           CHAT TOGGLE
        ===================================== */

        #chat-toggle-btn {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 58px;
            height: 58px;

            border: none;
            border-radius: 50%;

            background: #00a884;
            color: white;

            font-size: 27px;
            cursor: pointer;

            box-shadow: 0 6px 25px rgba(0,0,0,.55);

            display: none;
            align-items: center;
            justify-content: center;

            z-index: 3000;
        }

        /* =====================================
           CHAT CONTAINER
        ===================================== */

        #chat-container {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 360px;
            height: 520px;

            max-width: calc(100vw - 30px);
            max-height: calc(100dvh - 30px);

            display: none;
            flex-direction: column;

            background: #111b21;

            border-radius: 15px;
            overflow: hidden;

            box-shadow: 0 10px 40px rgba(0,0,0,.65);

            z-index: 4000;

            pointer-events: auto;
        }

        /* =====================================
           CHAT HEADER
        ===================================== */

        #chat-header {
            height: 55px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 15px;

            background: #202c33;
            color: white;

            font-weight: bold;
        }

        #chat-minimize-btn {
            border: 0;
            background: transparent;
            color: white;

            font-size: 22px;
            cursor: pointer;
        }

        /* =====================================
           MESSAGES
        ===================================== */

        #chat-messages {
            flex: 1;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 12px;

            display: flex;
            flex-direction: column;
            gap: 7px;

            background: #0b141a;
        }

        .chat-message {
            max-width: 82%;

            padding: 8px 10px;

            border-radius: 10px;

            color: white;

            word-break: break-word;
        }

        /* =====================================
           CHAT INPUT AREA
        ===================================== */

        #chatForm {
            position: relative;

            display: flex;
            align-items: center;

            padding: 8px;

            background: #202c33;
        }

        #chatInput {
            flex: 1;

            min-width: 0;

            padding: 11px 42px 11px 42px;

            border: 0;
            outline: none;

            border-radius: 22px;

            background: #2a3942;
            color: white;

            font-size: 15px;
        }

        #chatInput::placeholder {
            color: #aebac1;
        }

        #chat-attach-btn,
        #emojiButton,
        #voiceButton,
        #chat-send {
            position: absolute;

            width: 38px;
            height: 38px;

            border: 0;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        #chat-attach-btn {
            left: 10px;
        }

        #emojiButton {
            left: 45px;
        }

        #voiceButton {
            right: 8px;
        }

        #chat-send {
            right: 8px;
            display: none;
            color: #00a884;
        }

        /* =====================================
           ATTACHMENT MENU
        ===================================== */

        #attachment-menu {
            position: absolute;

            left: 8px;
            bottom: 58px;

            width: 190px;

            display: none;
            flex-direction: column;

            background: #202c33;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0,0,0,.6);

            overflow: hidden;

            z-index: 5000;
        }

        #attachment-menu button {
            padding: 13px;

            border: 0;
            border-bottom: 1px solid #37474f;

            background: transparent;
            color: white;

            text-align: left;

            cursor: pointer;
        }

        #attachment-menu button:hover {
            background: #2a3942;
        }

        /* =====================================
           EMOJI PICKER
        ===================================== */

        #emoji-picker-container {
            position: absolute;

            left: 5px;
            bottom: 58px;

            display: none;

            z-index: 5000;
        }

        emoji-picker {
            --emoji-size: 22px;
            width: 310px;
            height: 350px;
        }

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            #chat-container {
                left: 8px;
                right: 8px;

                bottom: 8px;

                width: auto;

                height: min(75dvh, 560px);

                border-radius: 15px;
            }

            #chat-toggle-btn {
                right: 15px;
                bottom: 15px;
            }

            #memoryButton {
                left: 12px;
            }

            emoji-picker {
                width: min(310px, calc(100vw - 20px));
                height: 330px;
            }

            #attachment-menu {
                left: 5px;
            }
        }

        /* =====================================
           AVATAR MARKERS
        ===================================== */

        .avatar-marker {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            overflow: hidden;

            border: 3px solid #00a884;

            background: white;

            box-shadow: 0 3px 12px rgba(0,0,0,.7);
        }

        .avatar-marker.friend {
            width: 42px;
            height: 42px;
        }

        .avatar-marker img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .memory-marker {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            overflow: hidden;

            border: 3px solid #00a884;

            background: white;

            box-shadow: 0 3px 12px rgba(0,0,0,.7);
        }

        .memory-marker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>

    <!-- Emoji -->
    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js">
    </script>
</head>

<body>

    <!-- GOOGLE 3D MAP -->
    <gmp-map-3d
        id="map"
        center="18.8136,82.7153,250"
        heading="0"
        tilt="67.5"
        range="900"
        mode="SATELLITE"
        gesture-handling="GREEDY">
    </gmp-map-3d>


    <div id="ui-layer">

        <!-- MEMORY -->
        <button id="memoryButton" title="Add memory">
            📸
        </button>

        <input
            id="memoryPhotoInput"
            type="file"
            accept="image/*"
        >


        <!-- CHAT OPEN -->
        <button id="chat-toggle-btn">
            💬
        </button>


        <!-- CHAT -->
        <div id="chat-container">

            <div id="chat-header">
                <span>💬 Koraput Chat</span>

                <button id="chat-minimize-btn">
                    −
                </button>
            </div>


            <div id="chat-messages"></div>


            <form id="chatForm">

                <!-- ATTACHMENT MENU -->
                <div id="attachment-menu">

                    <button type="button" id="att-media">
                        🖼️ Photo / Video
                    </button>

                    <button type="button" id="att-doc">
                        📄 Document
                    </button>

                    <button type="button" id="att-audio">
                        🎵 Audio
                    </button>

                    <button type="button" id="att-cam">
                        📷 Camera
                    </button>

                </div>


                <!-- EMOJI -->
                <div id="emoji-picker-container">

                    <emoji-picker id="emojiPicker"></emoji-picker>

                </div>


                <button
                    type="button"
                    id="chat-attach-btn"
                >
                    📎
                </button>


                <button
                    type="button"
                    id="emojiButton"
                >
                    😊
                </button>


                <input
                    id="chatInput"
                    type="text"
                    placeholder="Type a message..."
                    autocomplete="off"
                >


                <input
                    id="chatAttachment"
                    type="file"
                    hidden
                >


                <button
                    type="button"
                    id="voiceButton"
                >
                    🎤
                </button>


                <button
                    type="submit"
                    id="chat-send"
                >
                    ➤
                </button>

            </form>

        </div>

    </div>


    <!-- JOIN SCREEN -->
    <div id="join-screen">

        <div id="join-box">

            <h2>🌍 Koraput Map</h2>

            <form id="join-form">

                <input
                    id="nameInput"
                    type="text"
                    maxlength="40"
                    placeholder="Enter your name"
                    required
                >

                <input
                    id="avatarInput"
                    type="file"
                    accept="image/*"
                >

                <button type="submit">
                    Enter Map
                </button>

            </form>

        </div>

    </div>


    <!-- YOUR APP -->
    <script src="/app.js"></script>

</body>
</html>
