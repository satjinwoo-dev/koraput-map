<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Koraput Map</title>


<!-- ==========================================
     NORMAL GOOGLE MAPS
     NO GOOGLE 3D EARTH
========================================== -->

<script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"
    defer
></script>


<script src="/socket.io/socket.io.js"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    background: #071018;
    color: white;
}


/* ==========================================
   MAP
========================================== */

#map {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    background: #071018;
}


/* ==========================================
   MAP BUTTONS
========================================== */

#map-tools {
    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 5000;

    display: flex;
    flex-direction: column;

    gap: 8px;
}

.map-tool {
    width: 46px;
    height: 46px;

    border: 0;
    border-radius: 14px;

    background: rgba(10, 20, 27, 0.94);

    color: white;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);

    transition:
        transform .15s,
        background .15s;
}

.map-tool:hover {
    transform: scale(1.05);
    background: #17262f;
}


/* ==========================================
   MAP STYLE MENU
========================================== */

#map-style-menu {
    position: fixed;

    top: 20px;
    right: 76px;

    z-index: 5000;

    display: none;

    flex-direction: column;

    min-width: 145px;

    padding: 7px;

    border-radius: 14px;

    background:
        rgba(10, 20, 27, .96);

    box-shadow:
        0 10px 35px rgba(0,0,0,.55);
}

#map-style-menu.show {
    display: flex;
}

#map-style-menu button {
    border: 0;
    background: transparent;

    color: white;

    text-align: left;

    padding: 11px;

    border-radius: 9px;

    cursor: pointer;
}

#map-style-menu button:hover,
#map-style-menu button.active {
    background: #1b303b;
}


/* ==========================================
   MEMORY BUTTON
========================================== */

#memoryButton {
    position: fixed;

    left: 20px;
    top: 20px;

    z-index: 5000;

    width: 48px;
    height: 48px;

    border: 0;
    border-radius: 50%;

    background:
        rgba(10,20,27,.94);

    color: white;

    font-size: 21px;

    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);
}

#memoryPhotoInput {
    display: none;
}


/* ==========================================
   BOTTOM INFO
========================================== */

#bottom-info {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    z-index: 4500;

    display: flex;
    gap: 8px;

    pointer-events: none;
}

.info-pill {
    padding: 9px 14px;

    border-radius: 30px;

    background:
        rgba(7,16,24,.88);

    color: #e8f0f4;

    font-size: 13px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.4);
}


/* ==========================================
   JOIN SCREEN
========================================== */

#join-screen {
    position: fixed;
    inset: 0;

    z-index: 10000;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(0,0,0,.82),
            rgba(0,0,0,.55)
        );

    backdrop-filter: blur(8px);
}

.join-card {
    width: min(390px, calc(100% - 30px));

    padding: 28px;

    border-radius: 22px;

    background:
        rgba(17,27,33,.97);

    text-align: center;

    box-shadow:
        0 20px 70px rgba(0,0,0,.65);
}

.join-card h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.join-card p {
    margin: 0 0 22px;
    color: #aebac1;
}

#nameInput {
    width: 100%;

    padding: 14px;

    border: 1px solid #374248;
    border-radius: 12px;

    background: #202c33;
    color: white;

    outline: none;

    font-size: 16px;

    margin-bottom: 12px;
}

.avatar-label {
    display: block;

    padding: 12px;

    margin-bottom: 14px;

    border: 1px dashed #52616b;

    border-radius: 12px;

    color: #d5dde1;

    cursor: pointer;
}

.avatar-label input {
    display: none;
}

#joinButton {
    width: 100%;

    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: #10b981;

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}


/* ==========================================
   CHAT BUTTON
========================================== */

#chat-toggle-btn {
    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 6000;

    width: 58px;
    height: 58px;

    border: 0;
    border-radius: 50%;

    background: #10b981;

    color: white;

    font-size: 24px;

    cursor: pointer;

    box-shadow:
        0 8px 30px rgba(0,0,0,.5);
}

#unread-count {
    position: absolute;

    top: -3px;
    right: -3px;

    min-width: 20px;
    height: 20px;

    padding: 2px 5px;

    border-radius: 20px;

    background: #ef4444;

    color: white;

    font-size: 11px;
    font-weight: bold;

    display: none;

    align-items: center;
    justify-content: center;
}


/* ==========================================
   CHAT
========================================== */

#chat-container {
    position: fixed;

    right: 20px;
    bottom: 90px;

    z-index: 7000;

    width: 370px;
    height: 570px;

    display: none;
    flex-direction: column;

    overflow: hidden;

    border-radius: 18px;

    background:
        #111b21;

    box-shadow:
        0 15px 60px rgba(0,0,0,.65);
}

#chat-container.open {
    display: flex;
}


/* ==========================================
   CHAT HEADER
========================================== */

#chat-header {
    height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    background: #202c33;

    font-weight: bold;
}

#chat-header-title {
    display: flex;
    align-items: center;
    gap: 8px;
}

#online-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #10b981;

    box-shadow:
        0 0 8px #10b981;
}

#chat-minimize-btn {
    width: 34px;
    height: 34px;

    border: 0;
    border-radius: 50%;

    background: #2b3941;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* ==========================================
   ONLINE BAR
========================================== */

#online-bar {
    padding: 8px 12px;

    background: #172127;

    color: #aebac1;

    font-size: 12px;

    white-space: nowrap;
    overflow: hidden;
}


/* ==========================================
   CHAT MESSAGES
========================================== */

#chat-messages {
    flex: 1;

    overflow-y: auto;

    padding: 12px;

    display: flex;
    flex-direction: column;

    gap: 7px;
}

.message-row {
    display: flex;
    width: 100%;
}

.message-row.mine {
    justify-content: flex-end;
}

.message {
    position: relative;

    max-width: 82%;

    padding: 8px 10px;

    border-radius: 10px;

    background: #202c33;

    color: white;

    font-size: 14px;

    word-break: break-word;
}

.message.mine {
    background: #005c4b;
}

.message-name {
    margin-bottom: 3px;

    color: #60a5fa;

    font-size: 11px;
    font-weight: bold;
}

.message-time {
    margin-top: 4px;

    color: #9aa7ad;

    font-size: 9px;

    text-align: right;
}

.message img,
.message video {
    max-width: 250px;

    max-height: 260px;

    border-radius: 9px;

    display: block;
}

.message audio {
    max-width: 240px;
}

.message a {
    color: #7dd3fc;
}


/* ==========================================
   REPLY
========================================== */

.reply-preview {
    margin-bottom: 6px;

    padding: 6px 8px;

    border-left: 3px solid #10b981;

    border-radius: 5px;

    background: rgba(0,0,0,.18);

    color: #cbd5db;

    font-size: 11px;
}


/* ==========================================
   MESSAGE ACTIONS
========================================== */

.message-actions {
    display: none;

    position: absolute;

    right: 5px;
    top: -34px;

    gap: 3px;

    padding: 4px;

    border-radius: 9px;

    background: #26343c;

    box-shadow:
        0 5px 20px rgba(0,0,0,.4);
}

.message:hover .message-actions {
    display: flex;
}

.message-actions button {
    border: 0;

    background: transparent;

    color: white;

    cursor: pointer;

    padding: 4px;
}


/* ==========================================
   REACTIONS
========================================== */

.reactions {
    display: flex;

    gap: 4px;

    margin-top: 4px;
}

.reaction {
    padding: 3px 6px;

    border-radius: 10px;

    background: #172127;

    font-size: 11px;
}


/* ==========================================
   TYPING
========================================== */

#typing-indicator {
    min-height: 18px;

    padding: 0 13px 5px;

    color: #8fa2aa;

    font-size: 11px;
}


/* ==========================================
   CHAT FORM
========================================== */

#chatForm {
    display: flex;
    align-items: center;

    gap: 5px;

    padding: 8px;

    background: #202c33;
}

#chatInput {
    flex: 1;

    min-width: 0;

    padding: 11px 12px;

    border: 0;
    border-radius: 22px;

    background: #2a3942;

    color: white;

    outline: none;

    font-size: 14px;
}

.chat-icon-btn {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;
    border-radius: 50%;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 18px;
}

#chat-send {
    background: #10b981;
}

#chatAttachment,
#chat-camera-file {
    display: none;
}


/* ==========================================
   ATTACHMENT MENU
========================================== */

#attachment-menu {
    position: absolute;

    right: 52px;
    bottom: 62px;

    z-index: 5;

    display: none;
    flex-direction: column;

    padding: 6px;

    border-radius: 13px;

    background: #202c33;

    box-shadow:
        0 10px 35px rgba(0,0,0,.55);
}

#attachment-menu.show {
    display: flex;
}

#attachment-menu button {
    padding: 10px 13px;

    border: 0;

    border-radius: 8px;

    background: transparent;

    color: white;

    text-align: left;

    cursor: pointer;

    white-space: nowrap;
}

#attachment-menu button:hover {
    background: #2b3941;
}


/* ==========================================
   EMOJI
========================================== */

#emoji-picker-container {
    position: absolute;

    right: 8px;
    bottom: 62px;

    z-index: 10;

    display: none;

    width: 300px;

    max-width: calc(100vw - 16px);

    max-height: 320px;

    overflow: auto;

    padding: 10px;

    border-radius: 14px;

    background: #202c33;

    box-shadow:
        0 10px 35px rgba(0,0,0,.55);
}

#emoji-picker-container.show {
    display: block;
}

.emoji-grid {
    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    gap: 5px;
}

.emoji-grid button {
    border: 0;

    background: transparent;

    font-size: 22px;

    cursor: pointer;

    padding: 4px;

    border-radius: 7px;
}

.emoji-grid button:hover {
    background: #2b3941;
}


/* ==========================================
   PROFILE POPUP
========================================== */

.profile-card {
    min-width: 190px;

    color: #111;
}

.profile-card img {
    width: 60px;
    height: 60px;

    object-fit: cover;

    border-radius: 50%;

    display: block;

    margin-bottom: 8px;
}

.profile-name {
    font-weight: bold;

    font-size: 15px;
}

.profile-status {
    margin-top: 4px;

    color: #10a36f;

    font-size: 12px;
}

.profile-weather {
    margin-top: 5px;

    font-size: 12px;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

    #map-tools {
        top: 12px;
        right: 12px;
    }

    #memoryButton {
        top: 12px;
        left: 12px;
    }

    .map-tool {
        width: 48px;
        height: 48px;
    }

    #map-style-menu {
        top: 12px;
        right: 70px;
    }

    #bottom-info {
        bottom: 12px;

        max-width: calc(100vw - 100px);

        overflow: hidden;
    }

    .info-pill {
        font-size: 11px;
        padding: 8px 10px;
    }

    #chat-toggle-btn {
        right: 12px;
        bottom: 12px;
    }

    #chat-container {
        right: 0;
        bottom: 0;

        width: 100vw;
        height: 100dvh;

        border-radius: 0;
    }

    .message {
        max-width: 85%;
    }

    #chat-header {
        padding-top:
            env(safe-area-inset-top);

        height:
            calc(58px + env(safe-area-inset-top));
    }
}

</style>

</head>


<body>


<!-- ==========================================
     NORMAL GOOGLE MAP
========================================== -->

<div id="map"></div>


<!-- ==========================================
     MAP CONTROLS
========================================== -->

<button
    id="memoryButton"
    type="button"
    title="Add memory photo"
>
    📸
</button>

<input
    id="memoryPhotoInput"
    type="file"
    accept="image/*"
>


<div id="map-tools">

    <button
        class="map-tool"
        id="my-location-btn"
        type="button"
        title="My location"
    >
        ⦿
    </button>

    <button
        class="map-tool"
        id="map-style-btn"
        type="button"
        title="Map style"
    >
        ◈
    </button>

</div>


<div id="map-style-menu">

    <button
        type="button"
        data-style="satellite"
        class="active"
    >
        🛰️ Satellite
    </button>

    <button
        type="button"
        data-style="street"
    >
        🗺️ Street
    </button>

    <button
        type="button"
        data-style="hybrid"
    >
        🌍 Hybrid
    </button>

    <button
        type="button"
        data-style="terrain"
    >
        ⛰️ Terrain
    </button>

    <button
        type="button"
        data-style="dark"
    >
        🌑 Dark
    </button>

</div>


<!-- ==========================================
     BOTTOM INFO
========================================== -->

<div id="bottom-info">

    <div
        class="info-pill"
        id="location-pill"
    >
        📍 Koraput
    </div>

    <div
        class="info-pill"
        id="temperature-pill"
    >
        🌡️ --
    </div>

    <div
        class="info-pill"
        id="live-pill"
    >
        ● Live
    </div>

</div>


<!-- ==========================================
     JOIN SCREEN
========================================== -->

<section id="join-screen">

    <div class="join-card">

        <h1>🌍 Koraput Map</h1>

        <p>
            Explore Koraput and connect
            with your friends.
        </p>

        <input
            id="nameInput"
            type="text"
            maxlength="40"
            placeholder="Enter your name"
            autocomplete="name"
        >

        <label class="avatar-label">

            Choose profile photo

            <input
                id="avatarInput"
                type="file"
                accept="image/*"
            >

        </label>

        <button
            id="joinButton"
            type="button"
        >
            Join Map
        </button>

    </div>

</section>


<!-- ==========================================
     CHAT BUTTON
========================================== -->

<button
    id="chat-toggle-btn"
    type="button"
    title="Open chat"
>

    💬

    <span id="unread-count">
        0
    </span>

</button>


<!-- ==========================================
     CHAT
========================================== -->

<section id="chat-container">

    <header id="chat-header">

        <span id="chat-header-title">

            <span id="online-dot"></span>

            Koraput Chat

        </span>

        <button
            id="chat-minimize-btn"
            type="button"
        >
            −
        </button>

    </header>


    <div id="online-bar">
        Online: 0
    </div>


    <div id="chat-messages"></div>


    <div id="typing-indicator"></div>


    <!-- ATTACHMENTS -->

    <div id="attachment-menu">

        <button
            id="att-media"
            type="button"
        >
            🖼️ Photo / Video
        </button>

        <button
            id="att-doc"
            type="button"
        >
            📎 Document
        </button>

        <button
            id="att-audio"
            type="button"
        >
            🎵 Audio
        </button>

        <button
            id="att-cam"
            type="button"
        >
            📷 Camera
        </button>

    </div>


    <!-- EMOJI -->

    <div id="emoji-picker-container">

        <div
            class="emoji-grid"
            id="emojiPicker"
        ></div>

    </div>


    <!-- REPLY -->

    <div
        id="reply-bar"
        style="
            display:none;
            padding:8px 12px;
            background:#172127;
            border-left:3px solid #10b981;
            font-size:12px;
        "
    >

        <span id="reply-text"></span>

        <button
            id="cancel-reply"
            type="button"
            style="
                float:right;
                border:0;
                background:none;
                color:white;
                cursor:pointer;
            "
        >
            ✕
        </button>

    </div>


    <!-- INPUT -->

    <form id="chatForm">

        <button
            id="emojiButton"
            class="chat-icon-btn"
            type="button"
        >
            😊
        </button>


        <button
            id="chat-attach-btn"
            class="chat-icon-btn"
            type="button"
        >
            📎
        </button>


        <input
            id="chatAttachment"
            type="file"
            hidden
        >


        <input
            id="chat-camera-file"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
        >


        <input
            id="chatInput"
            type="text"
            maxlength="5000"
            autocomplete="off"
            placeholder="Type a message..."
        >


        <button
            id="voiceButton"
            class="chat-icon-btn"
            type="button"
        >
            🎤
        </button>


        <button
            id="chat-send"
            class="chat-icon-btn"
            type="submit"
        >
            ➤
        </button>

    </form>

</section>


<script src="/app.js"></script>

</body>
</html>
