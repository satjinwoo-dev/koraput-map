<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080e17">
<title>MapUnite: My bike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="js/garage/garage.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #080e17; }
  body { padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px); }
  #garage-root { max-width: 1120px; margin: 0 auto; }
  .page-back { display: inline-block; margin-bottom: 10px; color: #8b9bab; font: 600 14px/1 "Inter", system-ui, sans-serif; text-decoration: none; }
  .page-back:hover { color: #f2f6f8; }
  noscript p { color: #c6d2db; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<a class="page-back" href="./">‹ Back to the map</a>
<main id="garage-root" class="mu-garage" aria-live="polite"></main>
<noscript><p>My bike needs JavaScript.</p></noscript>

<script src="js/bikedb/catalog-search.js"></script>
<script src="js/physics/atmosphere.js"></script>
<script src="js/physics/tyre.js"></script>
<script src="js/physics/powertrain.js"></script>
<script src="js/physics/roadload.js"></script>
<script src="js/physics/model.js"></script>
<script src="js/physics/cruise.js"></script>
<script src="js/physics/index.js"></script>
<script src="js/garage/units.js"></script>
<script src="js/garage/store.js"></script>
<script src="js/garage/silhouettes.js"></script>
<script src="js/garage/picker.js"></script>
<script src="js/garage/settings.js"></script>
<script src="js/garage/visualizer.js"></script>
<script src="js/garage/garage.js"></script>
<script>
  (function () {
    // The Step 5 API (/api/bikes/search, /bundles, /requests): window.MU_GARAGE_API is the server origin
    // ("" = this page's origin, null = no server: static catalogue and bundles only, requests wait).
    //   - Website: unset → this page's origin (server.js serves both).
    //   - Android app: scripts/build-native.mjs sets it to MU_SERVER_ORIGIN. The app's own origin
    //     (https://localhost, capacitor://) has no API, so it is never used as the server.
    var api = typeof window.MU_GARAGE_API === "string" || window.MU_GARAGE_API === null ? window.MU_GARAGE_API
      : typeof window.MU_SERVER_ORIGIN === "string" ? window.MU_SERVER_ORIGIN
      : (location.protocol === "https:" && location.hostname === "localhost" && !location.port) || location.protocol === "capacitor:" || location.protocol === "file:" ? null
      : "";
    var store = MUGarage.store.createStore({
      search: window.BikeCatalogSearch,
      physics: window.MUPhysics,
      catalogUrl: "bikedb/catalog.json",
      staticBase: "bikedb/",
      apiBase: api === "" ? location.origin : api
    });
    window.MU_GARAGE = MUGarage.mount(document.getElementById("garage-root"), { store: store, physics: window.MUPhysics });
  })();
</script>
</body>
</html>
