<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <title>Koraput Map — Social Phase 2</title>

    <!-- Leaflet CSS (No Google API) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: #0b141a; color: white; }
        button, input { font: inherit; }
        button { cursor: pointer; }

        /* ==========================================
           LEAFLET MAP & ICONS
           ========================================== */
        #map { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; z-index: 1; background: #0b141a;}
        .leaflet-control-attribution { display: none !important; }

        .leaflet-marker-icon.avatar-icon { border-radius: 50%; object-fit: cover; background: #071018; padding: 1px; overflow: hidden; display: block;}
        .leaflet-marker-icon.avatar-icon.own-live-avatar { width: 36px !important; height: 36px !important; border: 2.5px solid #18d6a3; box-shadow: 0 0 0 2px rgba(24,214,163,0.18), 0 3px 10px rgba(0,0,0,0.65); animation: pulse 2s infinite;}
        .leaflet-marker-icon.avatar-icon.friend-marker { width: 34px !important; height: 34px !important; border: 2px solid #60a5fa; box-shadow: 0 0 0 2px rgba(96,165,250,0.15), 0 3px 10px rgba(0,0,0,0.6);}
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(24, 214, 163, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(24, 214, 163, 0); } 100% { box-shadow: 0 0 0 0 rgba(24, 214, 163, 0); } }

        .custom-pin .memory-pin-box { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: #071018; border: 2px solid white; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
        .custom-pin .memory-pin-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .weather-badge { padding: 4px 7px !important; border: 1px solid rgba(255,255,255,0.09) !important; border-radius: 999px !important; background: rgba(16,26,32,0.92) !important; color: #e8eef0 !important; font-size: 9px !important; font-weight: 650 !important; box-shadow: 0 4px 14px rgba(0,0,0,0.45); backdrop-filter: blur(5px);}
        .weather-badge::before { border-right-color: rgba(16,26,32,0.92) !important; }

        /* ==========================================
           UI ELEMENTS
           ========================================== */
        #map-info-panel { display: none; position: fixed; z-index: 7000; top: 18px; right: 18px; width: min(340px, calc(100vw - 36px)); max-height: 78dvh; overflow: auto; border-radius: 18px; background: #101a20ee; box-shadow: 0 14px 55px #0009; border: 1px solid #ffffff12; backdrop-filter: blur(10px); }
        #close-map-info { position: absolute; right: 9px; top: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #26343c; color: white; font-size: 22px; z-index: 2; }

        .map-top { position: fixed; z-index: 5000; top: 18px; left: 18px; display: flex; gap: 8px; }
        .map-btn { width: 46px; height: 46px; border: 1px solid #ffffff14; border-radius: 14px; background: #111b21e8; color: white; box-shadow: 0 5px 22px #0007; backdrop-filter: blur(10px);}
        .map-btn:hover { background: #1c2a32; }

        .map-style-menu { display: none; position: fixed; z-index: 6000; top: 70px; left: 18px; flex-direction: column; overflow: hidden; border-radius: 13px; background: #17242b; box-shadow: 0 10px 35px #0008; }
        .map-style-menu button { border: 0; padding: 11px 14px; background: transparent; color: white; text-align: left; }
        .map-style-menu button:hover, .map-style-menu button.active { background: #00a884; }

        .bottom-info { position: fixed; z-index: 4000; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none;}
        .pill { padding: 9px 13px; border-radius: 999px; background: #101a20e8; border: 1px solid #ffffff12; box-shadow: 0 5px 20px #0006; font-size: 13px; white-space: nowrap; backdrop-filter: blur(10px);}
        .live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: #18d6a3; box-shadow: 0 0 8px #18d6a3; }

        .memory-button { position: fixed; z-index: 5000; left: 18px; bottom: 18px; width: 52px; height: 52px; border: 0; border-radius: 16px; background: #00a884; color: white; font-size: 23px; box-shadow: 0 6px 25px #0008; }

        .join-screen { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: #0009; backdrop-filter: blur(8px); }
        .join-card { width: min(390px, calc(100% - 30px)); padding: 28px; border-radius: 22px; background: #111b21f5; box-shadow: 0 20px 70px #0009; text-align: center; }
        .join-card h1 { margin: 0 0 8px; font-size: 22px;}
        .join-card p { margin: 0 0 20px; color: #aebac1; font-size: 13px; }
        .join-card input[type="text"] { width: 100%; padding: 13px; border: 1px solid #37454d; border-radius: 12px; background: #202c33; color: white; outline: 0; margin-bottom: 12px; }
        .avatar-label { display: block; padding: 12px; border: 1px dashed #52616b; border-radius: 12px; color: #d5dde1; margin-bottom: 14px; cursor: pointer; font-size: 13px;}
        .avatar-label input { display: none; }
        .join-btn { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #00a884; color: white; font-weight: 700; font-size: 14px;}

        /* PROFILE POPUP CSS */
        .profile-card { position: relative; padding: 24px 18px 18px; text-align: center; }
        .profile-avatar-wrap { width: 82px; height: 82px; padding: 3px; margin: 4px auto 12px; border-radius: 50%; background: #00a884; box-shadow: 0 0 0 4px #00a88426, 0 8px 25px #0008; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #202c33; }
        .profile-name { margin: 0; font-size: 21px; font-weight: bold;}
        .profile-status { margin-top: 5px; color: #18d6a3; font-size: 13px; font-weight: 700; }
        .profile-info { display: grid; gap: 8px; margin-top: 18px; }
        .profile-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #17242b; font-size: 13px; }
        .profile-label { color: #8fa1aa; }
        .profile-focus { width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 10px; background: #00a884; color: white; font-weight: 700; }

        /* CHAT UI */
        .chat-toggle { position: fixed; z-index: 8500; right: 18px; bottom: 18px; width: 58px; height: 58px; border: 0; border-radius: 50%; background: #00a884; color: white; font-size: 25px; box-shadow: 0 6px 25px #0008; }
        .unread-badge { position: absolute; right: -2px; top: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #ff3b30; color: white; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; border: 2px solid #0b141a; }

        .chat { position: fixed; z-index: 9000; right: 18px; bottom: 18px; width: min(400px, calc(100vw - 30px)); height: min(650px, calc(100dvh - 36px)); display: none; flex-direction: column; overflow: hidden; border-radius: 18px; background: #111b21; box-shadow: 0 15px 60px #0009; }
        .chat-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: #202c33; }
        .chat-title { font-weight: 700; }
        .chat-subtitle { font-size: 11px; color: #91a2ab; margin-top: 2px; }
        .chat-head-right { display: flex; gap: 7px; }
        .head-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #30404a; color: white; display: flex; justify-content: center; align-items: center; font-size: 16px;}

        .online-list { padding: 8px 14px; background: #111b21; border-top: 1px solid #ffffff08; max-height: 160px; overflow-y: auto;}
        .online-title { font-size: 11px; color: #91a2ab; margin-bottom: 6px; }
        .online-friend { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; }
        .online-friend img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #18d6a3; margin-left: auto; box-shadow: 0 0 5px #18d6a3; }

        .messages { flex: 1; overflow-y: auto; padding: 14px; background: radial-gradient(circle at center, #17252c, #111b21); }
        .chat-message { position: relative; max-width: 84%; margin: 0 0 9px; padding: 8px 10px; border-radius: 11px; background: #202c33; word-break: break-word; clear: both; float: left;}
        .chat-message.mine { float: right; background: #005c4b; }
        .sender { font-size: 11px; color: #8de2cd; font-weight: 700; margin-bottom: 4px; }
        .msg-time { font-size: 9px; color: #91a2ab; margin-left: 7px; font-weight: 400; }

        .reply-preview-container { display: none; padding: 6px 8px; margin: 8px; border-left: 3px solid #18d6a3; background: #16252b; border-radius: 6px; font-size: 11px; color: #aebac1;}
        .reply-preview-container div { display: flex; justify-content: space-between; align-items: center;}
        .reply-preview-container button { background: none; border: none; color: #aebac1; font-size: 16px; cursor: pointer;}
        
        .inline-reply { padding: 4px 6px; margin-bottom: 6px; border-left: 3px solid #18d6a3; background: rgba(0,0,0,0.15); border-radius: 4px; font-size: 10px; color: #aebac1;}

        .message-actions { display: flex; gap: 4px; position: absolute; right: 5px; bottom: -22px; z-index: 3; }
        .action-btn { border: 0; border-radius: 10px; background: #26343c; color: white; font-size: 11px; padding: 4px 6px; display: none; }
        .chat-message:hover .action-btn, .chat-message:focus-within .action-btn { display: block; }

        .reaction-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .reaction { border: 1px solid #ffffff18; border-radius: 10px; padding: 2px 6px; background: #17242b; color: white; font-size: 10px; }

        .typing { height: 24px; padding: 0 14px; color: #91a2ab; font-size: 11px; background: #111b21; display: none; align-items: center;}

        .chat-form { position: relative; display: flex; align-items: center; gap: 6px; padding: 8px; background: #202c33; }
        .chat-input { flex: 1; min-width: 0; padding: 11px 12px; border: 0; border-radius: 11px; background: #2a3942; color: white; outline: 0; font-size: 13px;}
        .chat-icon { width: 40px; height: 40px; flex: 0 0 40px; border: 0; border-radius: 50%; background: #00a884; color: #111b21; font-size: 17px; display: flex; align-items: center; justify-content: center;}

        .menu { position: absolute; right: 58px; bottom: 60px; display: none; flex-direction: column; min-width: 160px; overflow: hidden; border-radius: 12px; background: #233139; box-shadow: 0 8px 25px #0008; z-index: 100;}
        .menu button { border: 0; padding: 11px 14px; background: transparent; color: white; text-align: left; font-size: 12px;}
        .menu button:hover { background: #30424d; }

        .emoji-panel { position: absolute; right: 10px; bottom: 60px; display: none; width: 310px; max-width: calc(100% - 20px); border-radius: 13px; background: #233139; box-shadow: 0 8px 25px #0008; z-index: 50;}
        emoji-picker { width: 100%; height: 320px; --background: #233139; --border-color: #30424d; }

        .chat-media { display: block; max-width: 260px; max-height: 240px; border-radius: 9px; margin-top: 5px; }
        .chat-audio { max-width: 260px; margin-top: 5px; }
        .chat-document { display: block; margin-top: 5px; padding: 9px; border-radius: 8px; background: #17242b; color: white; text-decoration: none; font-size: 12px;}

        @media (max-width:600px) {
            .map-top { top: max(12px, env(safe-area-inset-top)); left: 12px; }
            .memory-button { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
            .chat-toggle { right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
            .chat { right: 0; bottom: 0; width: 100vw; height: 100dvh; max-height: none; border-radius: 0; }
            .chat-header { height: calc(60px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); }
            .chat-form { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
            .bottom-info { bottom: 76px; }
            .map-style-menu { left: 12px; top: 70px; }
            #map-info-panel { top: auto; right: 12px; left: 12px; bottom: 78px; width: auto; max-height: none; }
        }
    </style>
</head>
<body>

<!-- MAP -->
<div id="map"></div>

<!-- PROFILE POPUP -->
<div id="map-info-panel">
    <div class="profile-card">
        <button id="close-map-info" aria-label="Close">×</button>
        <div class="profile-avatar-wrap">
            <img id="popup-avatar" class="profile-avatar" src="" alt="Avatar">
        </div>
        <h2 id="popup-name" class="profile-name">Friend</h2>
        <div class="profile-status">● Online</div>
        <div class="profile-info">
            <div class="profile-row"><span class="profile-label">Distance</span><strong id="popup-dist">--</strong></div>
            <div class="profile-row"><span class="profile-label">Weather</span><strong id="popup-weather">--</strong></div>
        </div>
        <button id="popup-fly-btn" class="profile-focus">View on Map</button>
    </div>
</div>

<!-- MAP CONTROLS -->
<div class="map-top">
    <button id="my-location-btn" class="map-btn" type="button" title="My location">⦿</button>
    <button id="compass-btn" class="map-btn" type="button" title="Compass"><span id="compass-icon">N</span></button>
    <button id="map-style-btn" class="map-btn" type="button" title="Map style">◈</button>
</div>

<div id="map-style-menu" class="map-style-menu">
    <button data-style="satellite" class="active" type="button">🛰️ Satellite</button>
    <button data-style="street" type="button">🗺️ Street</button>
    <button data-style="dark" type="button">🌑 Dark</button>
</div>

<!-- BOTTOM INFO -->
<div class="bottom-info">
    <div class="pill" id="pill-city">📍 Locating...</div>
    <div class="pill" id="weather-pill">🌡️ --°C</div>
    <div class="pill"><span class="live-dot"></span>Live Location</div>
</div>

<!-- MEMORY -->
<button id="memoryButton" class="memory-button" type="button" title="Add memory">📸</button>
<input id="memoryPhotoInput" type="file" accept="image/*" hidden>

<!-- JOIN SCREEN -->
<section id="join-screen" class="join-screen">
    <div class="join-card">
        <h1>🌍 Koraput Map</h1>
        <p>Connect with your friends in real time.</p>
        <input id="nameInput" type="text" maxlength="40" placeholder="Enter your name" autocomplete="name">
        <label class="avatar-label">Choose profile photo
            <input id="avatarInput" type="file" accept="image/*" hidden>
        </label>
        <button id="joinButton" class="join-btn" type="button">Join Map</button>
    </div>
</section>

<!-- CHAT BUTTON -->
<button id="chat-toggle-btn" class="chat-toggle" type="button" title="Open chat">💬<span id="unread-badge" class="unread-badge">0</span></button>

<!-- CHAT -->
<section id="chat-container" class="chat">
    <header class="chat-header">
        <div>
            <div class="chat-title">💬 Koraput Chat</div>
            <div id="chat-subtitle" class="chat-subtitle">0 online</div>
        </div>
        <div class="chat-head-right">
            <button id="online-btn" class="head-btn" type="button" title="Online friends">👥</button>
            <button id="chat-minimize-btn" class="head-btn" type="button">−</button>
        </div>
    </header>

    <!-- ONLINE FRIENDS -->
    <div id="online-list" class="online-list" style="display:none">
        <div class="online-title">ONLINE FRIENDS</div>
        <div id="online-friends"></div>
    </div>

    <!-- MESSAGES -->
    <div id="chat-messages" class="messages"></div>

    <!-- TYPING -->
    <div id="typing-indicator" class="typing"></div>

    <!-- ATTACHMENT MENU -->
    <div id="attachment-menu" class="menu">
        <button id="att-media" type="button">🖼️ Photo / Video</button>
        <button id="att-doc" type="button">📎 Document</button>
        <button id="att-audio" type="button">🎵 Audio</button>
        <button id="att-cam" type="button">📷 Camera</button>
    </div>

    <!-- EMOJI -->
    <div id="emojiPicker" class="emoji-panel">
        <emoji-picker></emoji-picker>
    </div>

    <!-- REPLY PREVIEW -->
    <div id="reply-preview-container" class="reply-preview-container">
        <div>
            <span id="reply-preview-text">Replying to...</span>
            <button id="cancel-reply-btn" title="Cancel reply">×</button>
        </div>
    </div>
    
    <!-- FORM -->
    <form id="chatForm" class="chat-form">
        <button id="emojiButton" class="chat-icon" style="background:#26343c; color:white;" type="button">😊</button>
        <button id="chat-attach-btn" class="chat-icon" style="background:#26343c; color:white;" type="button">📎</button>
        
        <input id="chatAttachment" type="file" hidden>
        <input id="chat-camera-file" type="file" accept="image/*" capture="environment" hidden>
        
        <input id="chatInput" class="chat-input" type="text" maxlength="1000" autocomplete="off" placeholder="Type a message...">
        
        <button id="voiceButton" class="chat-icon" style="background:#26343c; color:white;" type="button">🎤</button>
        <button id="sendButton" class="chat-icon" style="display:none;" type="submit">➤</button>
    </form>
</section>

<!-- Leaflet Library (Loaded at end for speed) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js"></script>

</body>
</html>
